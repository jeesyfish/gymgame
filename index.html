<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>俯卧撑网球联赛</title>
<style>
/* ==================== 基础样式 ==================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1B7A3D;--green-d:#145C2E;--bg:#F1F4F0;--card:#FFFFFF;--text:#1F2937;--muted:#6B7280;
  --line:#E2E8E4;--gold:#B8860B;--purple:#7E57C2;--blue:#1E88E5;--green2:#43A047;
  --gray:#90A4AE;--red:#D93025;--orange:#F9A825;--soft:#F6F8F5;--brown:#8D6E63;
}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#DDE5DC;color:var(--text);line-height:1.55}
#app{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);
  box-shadow:0 0 24px rgba(0,0,0,.12)}
/* ==================== 头部 ==================== */
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#14532D,#15803D);color:#FFF;
  padding:10px 14px 8px}
.hd-title{font-size:17px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.hd-ball{width:16px;height:16px;border-radius:50%;background:var(--orange);box-shadow:inset -2px -3px 0 rgba(0,0,0,.22);flex:none}
.hd-sub{font-size:12px;opacity:.92;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.hd-sub b{font-weight:700}
/* ==================== Tab 导航 ==================== */
nav{position:fixed;left:0;right:0;bottom:0;max-width:780px;margin:0 auto;z-index:40;display:flex;background:#FFF;
  border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(0,0,0,.08);overflow-x:auto;
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;min-width:64px;padding:9px 6px;background:none;border:none;font-size:14px;color:var(--muted);
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}
main{padding:12px 12px calc(104px + env(safe-area-inset-bottom,0px));flex:1}
/* ==================== 通用组件 ==================== */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(21,60,35,.08)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--green);color:#FFF;border:none;
  border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:active{filter:brightness(.92)}
.btn:disabled{background:#B7C2B9;cursor:default}
.btn-ghost{background:#FFF;color:var(--green);border:1.5px solid var(--green)}
.btn-danger{background:var(--red)}
.btn-warn{background:var(--orange);color:#4A3000}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-block{display:flex;width:100%}
.input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;background:#FFF}
.input:focus{outline:none;border-color:var(--green)}
textarea.input{font-size:13px;font-family:ui-monospace,Consolas,monospace;line-height:1.4}
select.input{font-size:14px}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;color:#FFF;line-height:1.6}
.lv-GS{background:var(--gold)}.lv-MASTERS{background:var(--purple)}.lv-ATP500{background:var(--blue)}
.lv-ATP250{background:var(--green2)}.lv-CHALLENGER{background:var(--gray)}.lv-FINALS{background:var(--red)}
.lv-ITF{background:var(--brown)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--soft);border:1px solid var(--line);
  font-size:12px;color:var(--muted)}
.tag-strong{background:#E8F5E9;border-color:#A5D6A7;color:var(--green-d);font-weight:700}
.warn-box{background:#FDECEA;border:1.5px solid #F5B7B1;color:#B71C1C;border-radius:10px;padding:10px 12px;font-size:13px}
.info-box{background:#E8F1FB;border:1.5px solid #B9D2F0;color:#0B4A8B;border-radius:10px;padding:10px 12px;font-size:13px}
/* ==================== 今日比赛 ==================== */
.score-big{font-size:64px;font-weight:900;text-align:center;color:var(--green-d);line-height:1.15;
  animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.55);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.set-result{font-size:22px;font-weight:800;text-align:center;padding:10px;border-radius:10px;margin:8px 0}
.set-win{background:#E8F5E9;color:var(--green-d)}
.set-lose{background:#FDECEA;color:#B71C1C}
.match-score{display:flex;justify-content:center;gap:14px;font-size:18px;font-weight:800;margin:6px 0}
.match-score span{padding:4px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.opp-card{display:flex;justify-content:space-between;gap:10px;align-items:center}
.opp-name{font-size:17px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.me td{background:#FFF7E0;font-weight:700}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}.flat{color:var(--muted)}
/* ==================== 签表 ==================== */
.cal-week{margin-bottom:10px}
.cal-week-t{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:5px}
.chip{display:inline-block;margin:0 6px 6px 0;padding:6px 10px;border-radius:9px;color:#FFF;font-size:12.5px;
  cursor:pointer;border:none;text-align:left}
.chip.ch-active{outline:3px solid #FDD835}
.chip.ch-done{opacity:.55}
.chip .chip-d{display:block;font-size:11px;opacity:.9;font-weight:400}
/* 9.2 玩家参与赛事高亮 + 状态徽章 */
.chip.ch-me{box-shadow:0 0 0 3px rgba(249,168,37,.9),0 2px 6px rgba(0,0,0,.18)}
.chip.ch-done.ch-me{box-shadow:0 0 0 3px rgba(249,168,37,.45)}
.pbadge{display:inline-flex;align-items:center;gap:4px;margin:2px 0 0 6px;padding:1px 8px;border-radius:12px;
  font-size:11px;font-weight:800;color:#FFF;vertical-align:middle;line-height:1.5}
.pbadge i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.95);flex:none}
.pb-live{background:#2E9E5B}.pb-live i{animation:pbpulse 1.2s infinite}
.pb-out{background:#8D9BA6}
.pb-champ{background:linear-gradient(135deg,#D9B23A,#B8860B)}
.pb-ent{background:#1E88E5}
.pbadge em{font-style:normal;font-weight:600;opacity:.92}
@keyframes pbpulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (max-width:400px){.pbadge em{display:none}.pbadge{padding:1px 6px;font-size:10px;margin-left:4px}}
.draw{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.draw-r{flex:1 0 118px;min-width:118px}
.draw-r h4{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.m{border:1px solid var(--line);border-radius:8px;padding:5px 7px;margin-bottom:6px;font-size:11.5px;
  background:#FFF;cursor:pointer;line-height:1.45}
.m b{font-weight:800}
.m .won{color:var(--green-d)}
.m-me{border:2px solid var(--orange);background:#FFFDF3}
.m-hl{outline:3px solid #F9A825;border-radius:8px;animation:pop .5s ease}
.m-pending{opacity:.75;font-style:italic}
/* ==================== 图表 / 统计 ==================== */
canvas.chart{width:100%;height:180px;background:#FFF;border:1px solid var(--line);border-radius:10px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}
.stat .v{font-size:19px;font-weight:900;color:var(--green-d)}
.stat .k{font-size:11px;color:var(--muted);margin-top:2px}
/* ==================== 弹层 / 提示 ==================== */
.overlay{position:fixed;inset:0;background:rgba(15,30,20,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#FFF;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:82vh;overflow:auto}
.modal h3{margin-bottom:10px}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#263238;color:#FFF;padding:9px 18px;
  border-radius:22px;font-size:13.5px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%}
#toast.show{opacity:.95}
/* ==================== 设置 ==================== */
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.cfg-row label{font-size:13.5px;flex:1}
.cfg-row .input{width:104px;padding:7px 8px;font-size:14px;flex:none}
.cfg-row .cur{font-size:12px;color:var(--muted);display:block}
.queued-badge{font-size:11px;background:#FFF3CD;color:#8A6D00;padding:1px 7px;border-radius:10px;margin-left:6px}
.hidden{display:none!important}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.center{text-align:center}
.mt{margin-top:10px}.mb{margin-bottom:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-title"><span class="hd-ball"></span>俯卧撑网球联赛</div>
    <div class="hd-sub" id="hd-sub"></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="overlay-root"></div>
<div id="toast"></div>
<input type="file" id="import-file" accept="application/json,.json" class="hidden">
<script>
'use strict';
/* ########################################################################
 * 第 10 章 · 全局配置
 * ######################################################################## */
const SAVE_KEY = 'pushupTennis.save.v1';   // 存档键（schema v1，见第 8 章）
const USER_ID  = 1001;                     // 玩家固定 id（AI 为 1~1000）

// 赛事级别元数据：签表 / 轮数 / 种子数 / 入围排名门槛（第 5.1 章）
const LEVEL_META = {
  GS:        { label:'大满贯', drawSize:128, seeds:32, rounds:7, cutoff:900,  color:'var(--gold)',   rank:6 },
  MASTERS:   { label:'大师赛', drawSize:64,  seeds:8,  rounds:6, cutoff:800,  color:'var(--purple)', rank:5 },
  ATP500:    { label:'ATP500', drawSize:32,  seeds:8,  rounds:5, cutoff:600,  color:'var(--blue)',   rank:4 },
  ATP250:    { label:'ATP250', drawSize:32,  seeds:8,  rounds:5, cutoff:500,  color:'var(--green2)', rank:3 },
  CHALLENGER:{ label:'挑战赛', drawSize:32,  seeds:8,  rounds:5, cutoff:null, color:'var(--gray)',   rank:2 },
  ITF:       { label:'ITF未来赛', drawSize:32, seeds:8, rounds:5, cutoff:null, color:'var(--brown)', rank:1 }, // 门槛见 entryCutoff.ITF（正赛 300 / 资格赛不限，弱者优先取人）
  FINALS:    { label:'总决赛', drawSize:8,   seeds:8,  rounds:5, cutoff:null, color:'var(--red)',    rank:7 },
};
// ITF 未来赛在一周内的开赛偏移（每周第 1/3/5 天，相互错开）
const ITF_OFFSETS = [0, 2, 4, 6, 1, 3, 5];
// 赛季结构：20 周 = 140 赛日（大满贯含 3 天资格赛后周期变长，赛季相应延长，5.2）
const TOTAL_WEEKS = 20, FINALS_WEEK = 19, SEASON_DAYS = TOTAL_WEEKS * 7; // 140
// 轮次名称（第 5.1 章签表轮数）
const ROUND_NAMES = {
  128:['R128','R64','R32','R16','QF','SF','F'],
  64 :['R64','R32','R16','QF','SF','F'],
  32 :['R32','R16','QF','SF','F'],
};
// 轮次中文显示
const ROUND_LABEL = { R128:'首轮', R64:'次轮', R32:'第三轮', R16:'16强战', QF:'1/4决赛', SF:'半决赛', F:'决赛',
  RR1:'小组赛第1轮', RR2:'小组赛第2轮', RR3:'小组赛第3轮', FINALSF:'半决赛', FINALF:'决赛',
  Q1:'资格赛第1轮', Q2:'资格赛第2轮', Q3:'资格赛决胜轮' };
// 正赛轮次标注：第 k 轮（N 强），按签表大小推导（修复 32 签首轮误标"第三轮"）
const ROUND_OF = { R128:'128强', R64:'64强', R32:'32强', R16:'16强', QF:'八强', SF:'半决赛', F:'决赛' };
function mainRoundLabel(level, name) {
  const arr = ROUND_NAMES[LEVEL_META[level].drawSize];
  const i = arr.indexOf(name);
  return '正赛第 ' + (i + 1) + ' 轮（' + (ROUND_OF[name] || name) + '）';
}
// 轮次 -> 积分表行键（第 6.1 章）
const ROW_KEY = { R128:'r128', R64:'r64', R32:'r32', R16:'r16', QF:'qf', SF:'sf', F:'final', W:'winner' };
// 最佳成绩比较顺序
const ROUND_ORDER = { R128:0, R64:1, R32:2, R16:3, QF:4, SF:5, F:6, W:7, RR:2, FINALSF:5, FINALF:6 };

// 20 周赛历模板（第 5.2 章）：ITF 未来赛由 buildCalendar 按 itfPerWeek 每周自动注入，不占模板
const DEFAULT_CALENDAR = [
  ['ATP250','CHALLENGER','CHALLENGER'],        // W1
  ['ATP500','ATP250','CHALLENGER','CHALLENGER'],// W2
  ['MASTERS','CHALLENGER','CHALLENGER'],       // W3
  ['GS','CHALLENGER','CHALLENGER'],            // W4
  ['ATP250','ATP250','CHALLENGER'],            // W5
  ['MASTERS','ATP500','CHALLENGER'],           // W6
  ['ATP250','CHALLENGER','CHALLENGER'],        // W7
  ['MASTERS','CHALLENGER','CHALLENGER'],       // W8
  ['ATP500','ATP250','CHALLENGER'],            // W9
  ['GS','CHALLENGER','CHALLENGER'],            // W10
  ['MASTERS','CHALLENGER'],                    // W11
  ['ATP250','CHALLENGER','CHALLENGER'],        // W12
  ['MASTERS','ATP500'],                        // W13
  ['GS','CHALLENGER','CHALLENGER'],            // W14
  ['MASTERS','ATP250','CHALLENGER'],           // W15
  ['ATP500','ATP250','CHALLENGER'],            // W16
  ['GS','CHALLENGER'],                         // W17
  ['ATP250','ATP250','CHALLENGER'],            // W18（缓冲周：吸收大满贯资格赛+正赛 10 天跨度）
  ['FINALS'],                                  // W19 年终总决赛（第 5.4 章）
  [],                                          // W20 休赛周（赛季收官）
];

// 建档偏好（与赛季配置分离）：重新开始后依然保留，如 preseason 开关
const PREFS_KEY = 'pushupTennis.prefs.v1';
function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } }
function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) { /* 忽略 */ } }

// 默认全局配置（第 10 章配置清单）
function defaultConfig() {
  return {
    preseason: loadPrefs().preseason !== false, // 建档期行为：是否预模拟第 0 赛季（重新开始时生效）
    base: 10,            // AI 基础实力分布均值
    distSigma: 0.5,      // 对数正态 σ（金字塔陡峭程度）
    sMin: 3, sMax: 30,   // SRange 基础实力截断区间
    poolSize: 1000,      // AI 选手数量
    decayBase: 0.15,     // 全局体力衰减基准
    traitMin: 0.6, traitMax: 1.4, // 个人衰减特质系数范围
    matchFormAmp: 2,     // 单场手感幅度 ±2
    setJitterAmp: 1,     // 单局抖动幅度 ±1
    finalsPoints: { rr:200, sf:400, f:500 }, // 总决赛积分（第 5.4 章）
    // 5.1 双卡门槛：正赛/资格赛入围排名上限（ITF 特殊：正赛前 300、资格赛无限制）
    entryCutoff: {
      GS:        { main: 150, qual: 300 },
      MASTERS:   { main: 50,  qual: 300 },
      ATP500:    { main: 50,  qual: 300 },
      ATP250:    { main: 50,  qual: 300 },
      CHALLENGER:{ main: 100, qual: 600 },
      ITF:       { main: 500, qual: null, excludeTop: 200 }, // 前 200 名禁入 ITF
    },
    maxEventsPerWeek: 1,          // 每 AI 每赛季周（按开赛日周计）最多参赛站数，无级别豁免（5.3）；玩家豁免
    entryWindowDays: 7,           // 玩家报名窗口：今日开赛 + 未来 N 天内开赛的赛事可手动选择报名（5.3）
    attendanceRange: [0.4, 1.0],  // AI 出勤率 U[min,max]：非大满贯以该概率报名（3.1/5.3）
    itfPerWeek: 5,                // 每周 ITF 未来赛站数（低排名选手积分来源，5.2）
    qualPoints: { GS:8, MASTERS:4, ATP500:2, ATP250:2, CHALLENGER:1, ITF:1 }, // 资格赛每轮胜场积分（6.1）
    // ATP 2025 真实积分表 + ITF 积分表（第 6.1 章）
    pointsTable: {
      GS:        { winner:2000, final:1300, sf:800, qf:400, r16:200, r32:100, r64:50, r128:10 },
      MASTERS:   { winner:1000, final:650,  sf:400, qf:200, r16:100, r32:50,  r64:10 },
      ATP500:    { winner:500,  final:330,  sf:200, qf:100, r16:50,  r32:0 },
      ATP250:    { winner:250,  final:165,  sf:100, qf:50,  r16:25,  r32:0 },
      CHALLENGER:{ winner:125,  final:75,   sf:45,  qf:25,  r16:10,  r32:0 },
      ITF:       { winner:25,   final:16,   sf:8,   qf:4,   r16:2,   r32:0 },
    },
    calendarTemplate: JSON.parse(JSON.stringify(DEFAULT_CALENDAR)),
  };
}

/* ########################################################################
 * 工具函数：随机数 / 日期 / 通用
 * ######################################################################## */
let state = null; // 全局存档对象（第 8 章 schema v1）
let FF_DISABLED = false; // 测试钩子：禁用直通快进（A/B 一致性对比用），正常游戏恒为 false

// 可持久化状态的线性同余随机数（存档重载后序列继续，保证世界可复现）
function nextRand() {
  state.rngState = (state.rngState * 1664525 + 1013904223) >>> 0;
  return state.rngState / 4294967296;
}
function randInt(a, b) { return a + Math.floor(nextRand() * (b - a + 1)); }
function randNorm() { // Box-Muller 标准正态
  let u = 0, v = 0;
  while (u === 0) u = nextRand();
  while (v === 0) v = nextRand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(nextRand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function fmtDate(d) { // 本地时区 YYYY-MM-DD
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayStr() { return fmtDate(new Date()); }
function cfg() { return state.config.current; } // 当前生效配置
function absDayOf(seasonN, day) { return SEASON_DAYS * (seasonN - 1) + day; } // 绝对赛日
function absDay() { return absDayOf(state.season.number, state.season.day); }
function weekOf(day) { return Math.floor((day - 1) / 7) + 1; } // 赛日所属赛季周（5.3 周限额按开赛日周计数）
// 赛季长度：20 周固定 = 140 个赛日（5.2）；赛历中未排赛事的赛日记为休赛期/训练休息日
function seasonLength() { return SEASON_DAYS; }
function playerById(id) { return id === USER_ID ? state.user : state.players[id - 1]; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
/* ########################################################################
 * 第 3 章 · 选手模型
 * ######################################################################## */

function tournamentNameOf(level, idx) {
  if (level === 'FINALS') return 'ATP年终总决赛';
  const pool = NAME_POOLS[level];
  const base = pool[idx % pool.length];
  const dup = Math.floor(idx / pool.length);
  if (level === 'CHALLENGER') return base + '挑战赛' + (dup ? ' ' + (dup + 1) : '');
  if (level === 'ITF') return base + ' ITF未来赛' + (dup ? ' ' + (dup + 1) : '');
  return base + (dup ? ' ' + (dup + 1) : '');
}

// 3.1/3.2：生成 AI 选手池 —— S 服从对数正态（均值 = base），截断到 [sMin,sMax]；f 离散均匀、步长 0.05
// 3.1：attendance 为报名倾向 U[attendanceRange]，非大满贯按该概率报名（5.3）
function genPool(c) {
  const players = [];
  const sigma = c.distSigma;
  const mu = Math.log(c.base) - sigma * sigma / 2; // 使分布均值 = base
  const steps = Math.round((c.traitMax - c.traitMin) / 0.05);
  const [attMin, attMax] = c.attendanceRange || [0.4, 1.0];
  for (let id = 1; id <= c.poolSize; id++) {
    const raw = Math.exp(mu + sigma * randNorm());
    const S = clamp(Math.round(raw), c.sMin, c.sMax);
    const f = +(c.traitMin + 0.05 * Math.floor(nextRand() * (steps + 1))).toFixed(2);
    const attendance = +(attMin + (attMax - attMin) * nextRand()).toFixed(3);
    const name = FIRST_NAMES[randInt(0, FIRST_NAMES.length - 1)] + ' ' + LAST_NAMES[randInt(0, LAST_NAMES.length - 1)];
    const country = COUNTRIES[randInt(0, COUNTRIES.length - 1)];
    players.push({ id, name, country, S, f, attendance, points: [], ranking: id, prevRanking: id, lastPoints: 0 });
  }
  return players;
}
// 3.1：风格标签 —— f 映射为"耐造型/爆发型"（9.1）
function styleOf(f) { return f <= 0.8 ? '耐造型' : (f >= 1.2 ? '爆发型' : '均衡型'); }

/* ########################################################################
 * 第 3.3 章 · 单场比赛数值生成（核心公式）
 *    M   = S + U{-2..+2}                 （单场手感，整场恒定）
 *    d   = decayBase × f                 （个人本场衰减率）
 *    G_k = round( M × (1 − d×(k−1)) + U{-1..+1} )，下限 1
 * ######################################################################## */
function genMatchM(S, c) { return S + randInt(-c.matchFormAmp, c.matchFormAmp); }
function genSetScore(M, k, f, c) {
  const d = c.decayBase * f;
  const g = Math.round(M * (1 - d * (k - 1)) + randInt(-c.setJitterAmp, c.setJitterAmp));
  return Math.max(g, 1);
}
/* ########################################################################
 * 第 5 章 · 赛季与日历
 * ######################################################################## */
// 周内开赛日均匀错开（步长 2 轮转，与 7 互质）：资格赛使赛事周期变为 8~10 天，
// 若沿用挤堆排布，高并发会抽干 1000 人池；均匀分布后并发占用稳定在 ~40%。
function computeOffsets(sorted) {
  return sorted.map((_, i) => (i * 2) % 7);
}

// 5.2：由模板生成本赛季 20 周赛历（生成后固定，第 8 章）；ITF 未来赛每周自动注入
function buildCalendar(template) {
  const cal = [];
  let slot = 0;
  const counters = {};
  const usedNames = new Set(); // 同赛季赛事名唯一：重名追加"·第N站"
  const uniqueName = base => {
    let name = base, k = 2;
    while (usedNames.has(name)) name = base + '·第' + (k++) + '站';
    usedNames.add(name);
    return name;
  };
  const itfN = Math.max(0, cfgSafeItf());
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const list = (template[w - 1] || []).slice();
    if (w === FINALS_WEEK) { // 年终总决赛独占一周（5.4）；总决赛为邀请赛，不设资格赛
      cal.push({ id: `S${state.season.number}-FIN`, slotIndex: slot++, week: w, startDay: (w - 1) * 7 + 1,
        level: 'FINALS', name: uniqueName(tournamentNameOf('FINALS', 0)), duration: 5 });
    }
    // 本周全部赛事（常规 + ITF 注入，总决赛周与收官周同样注入 ITF，低排名选手全程有赛可打）
    const all = (w === FINALS_WEEK ? [] : list.filter(lv => LEVEL_META[lv] && lv !== 'FINALS')
      .map(lv => ({ level: lv, rounds: LEVEL_META[lv].rounds })));
    for (let i = 0; i < itfN; i++) all.push({ level: 'ITF', rounds: LEVEL_META.ITF.rounds });
    if (all.length) {
      all.sort((a, b) => b.rounds - a.rounds || LEVEL_META[b.level].rank - LEVEL_META[a.level].rank);
      const offs = computeOffsets(all);
      const itf0 = all.findIndex(t => t.level === 'ITF');
      if (itf0 >= 0) offs[itf0] = 0; // 每周第 1 天必有一站 ITF：低排名选手与玩家当天即有赛可报
      all.forEach((t, i) => {
        const idx = counters[t.level] || 0; counters[t.level] = idx + 1;
        const dur = t.rounds + 3; // +3 天资格赛（5.3）
        // 收官周钳制：赛事周期不得溢出赛季（否则直通快进会冲出赛季末）
        const sd = Math.min((w - 1) * 7 + offs[i] + 1, SEASON_DAYS - dur + 1);
        cal.push({ id: `S${state.season.number}-T${String(slot + 1).padStart(2, '0')}`, slotIndex: slot++,
          week: w, startDay: sd, level: t.level,
          name: uniqueName(tournamentNameOf(t.level, idx)), duration: dur });
      });
    }
  }
  return cal;
}
function cfgSafeItf() { return (state.config && state.config.current.itfPerWeek) || 3; }

// 11.3：不设轮空 —— 正赛与资格赛签表均严格取满。正赛 = 7/8 直接入围 + 1/8 资格赛晋级（5.3）
function createTournament(event) {
  const meta = LEVEL_META[event.level];
  const mk = n => Array.from({ length: n }, () => ({ a: null, b: null, sets: [], winner: null, played: false }));
  const t = { id: event.id, slotIndex: event.slotIndex, level: event.level, name: event.name,
    status: 'inProgress', startDay: event.startDay, drawSize: meta.drawSize,
    directCount: meta.drawSize * 7 / 8,           // 直接入围名额（含玩家保留位）
    userStatus: 'notEntered', alive: [],
    qual: { rounds: [{ matches: mk(meta.drawSize / 2) }, { matches: mk(meta.drawSize / 4) }, { matches: mk(meta.drawSize / 8) }], winners: [] },
    rounds: ROUND_NAMES[meta.drawSize].map((name, ri) => ({ name, matches: mk(meta.drawSize >> (ri + 1)) })) };
  return t;
}

// 当前所有"仍在签表中存活"的选手（进行中途不可再报名其他赛事，5.3.3）
// 正赛入围者与资格赛选手均在 alive 内：从报名起即占用当周名额、排除其他新签
function busySet() {
  const s = new Set();
  for (const t of state.tournaments) {
    if (t.status !== 'inProgress' || t.finals) continue;
    for (const id of t.alive) s.add(id);
  }
  return s;
}

// 5.3：id 选手在 week 周（按赛事开赛日所在周计）已报名的站数（正赛或资格赛均计入）
function countWeekEvents(id, week) {
  let n = 0;
  for (const t of state.tournaments) {
    if (weekOf(t.startDay) !== week) continue;
    if (t.finals) {
      if (t.groups.A.includes(id) || t.groups.B.includes(id)) n++;
      continue;
    }
    let found = false;
    for (const m of t.rounds[0].matches) if (m.a === id || m.b === id) { found = true; break; }
    if (!found) for (const qr of t.qual.rounds) { for (const m of qr.matches) if (m.a === id || m.b === id) { found = true; break; } if (found) break; }
    if (found) n++;
  }
  return n;
}

// 5.3 双卡门槛：正赛池 = 排名 ≤ 正赛门槛；资格赛池 = 正赛门槛 < 排名 ≤ 资格赛门槛（null = 不限）
// ITF 特例：正赛池同为 ≤300，但直接区 28 席按"弱者优先"（排名数值最高者）取人；资格赛不限且弱者优先。
function entryEligibility(level, ranking) {
  const c = (cfg().entryCutoff || {})[level];
  if (!c) return null;
  if (c.excludeTop != null && ranking <= c.excludeTop) return null; // 禁入区（如 ITF 前 200 名）
  if (ranking <= c.main) return 'main';
  if (c.qual == null || ranking <= c.qual) return 'qual';
  return null;
}
function entryPool(t) { // 仅存活排除；门槛过滤在正/资格赛池各自进行
  const busy = busySet();
  return state.players.filter(p => !busy.has(p.id));
}
// 池子只做门槛/排除过滤，周限额与出勤抽签由 lotterySelect 统一处理（其放宽链依赖未过滤池）
function mainPool(t) { // 正赛池：≤ 正赛门槛且不在禁入区
  const c = cfg().entryCutoff[t.level];
  return entryPool(t).filter(p => p.ranking <= c.main && (c.excludeTop == null || p.ranking > c.excludeTop));
}
function qualPool(t, directIds) { // 资格赛池：资格赛门槛内、未入直接区者（含正赛落选者）；禁入区排除
  const c = cfg().entryCutoff[t.level];
  return entryPool(t).filter(p => (c.qual == null || p.ranking <= c.qual)
    && (c.excludeTop == null || p.ranking > c.excludeTop) && !directIds.has(p.id));
}
// 直接区溢出候选：正赛池不足时按排名递补资格赛合格者；同样受周限额约束与禁入区（不双赛）
function spillPoolFor(t) {
  const c = cfg().entryCutoff[t.level];
  const week = weekOf(state.season.day);
  return entryPool(t).filter(p => countWeekEvents(p.id, week) < cfg().maxEventsPerWeek
    && (c.qual == null || p.ranking <= c.qual) && (c.excludeTop == null || p.ranking > c.excludeTop));
}
const byDirOrder = (level) => level === 'ITF' ? (a, b) => b.ranking - a.ranking : (a, b) => a.ranking - b.ranking;
function lotterySelect(pool, t, needed, extraFilter, spillPool) {
  const c = cfg();
  const week = weekOf(state.season.day);
  let base = pool.filter(p => countWeekEvents(p.id, week) < c.maxEventsPerWeek);
  if (extraFilter) base = base.filter(extraFilter);
  const willing = p => t.level === 'GS' || nextRand() < p.attendance; // 大满贯必报
  let cand = base.filter(willing);
  if (cand.length < needed) cand = base; // 放宽意愿重扫
  const byRank = byDirOrder(t.level);
  cand.sort(byRank);
  let ents = cand.slice(0, needed);
  if (ents.length < needed && spillPool) { // 直接区溢出：资格赛合格者按排名递补（正赛池不足时）
    const have = new Set(ents.map(p => p.id));
    const spill = spillPool.filter(p => !have.has(p.id) && (!extraFilter || extraFilter(p))).sort(byRank);
    ents = ents.concat(spill.slice(0, needed - ents.length));
  }
  if (ents.length < needed) { // 放宽周限额兜底（正常不应触发）
    console.warn('[报名放宽]', t.id, '缺', needed - ents.length, '人，放宽周限额填坑');
    const have = new Set(ents.map(p => p.id));
    const restPool = pool.filter(p => !have.has(p.id) && (!extraFilter || extraFilter(p))).sort(byRank);
    ents = ents.concat(restPool.slice(0, needed - ents.length));
  }
  if (ents.length < needed) { // 最终兜底：签表必须完整（11.3），从全池未入选者中忽略 busy/限额强制填坑（不含玩家）
    console.warn('[报名兜底]', t.id, '仍缺', needed - ents.length, '人，忽略全部限制填坑');
    const have = new Set(ents.map(p => p.id));
    const all = state.players.filter(p => !have.has(p.id) && p.id !== USER_ID && (!extraFilter || extraFilter(p))).sort(byRank);
    ents = ents.concat(all.slice(0, needed - ents.length));
  }
  return ents;
}
// 正赛直接入围（7/8 名额）：正赛池（排名≤正赛门槛）按排名竞争，ITF 弱者优先；玩家经 forceUserInto 按位次顶替入签
function selectDirect(t) {
  const ents = lotterySelect(mainPool(t), t, t.directCount, null,
    t.level === 'ITF' ? null : spillPoolFor(t));
  ents.sort(byDirOrder(t.level));
  return ents;
}
// 资格赛签表（= 正赛大小）：资格赛池（含正赛落选者）取满；ITF 不限且弱者优先
function selectQualifiers(t, directIds) {
  return lotterySelect(qualPool(t, directIds), t, t.drawSize);
}

// 11.2：种子落位（直接入围者中前 seeds 名为种子；资格赛晋级者不设种子，资格赛结束后随机落入资格赛签位）
function fillDraw(t, directEntrants, qualEntrants) {
  const n = t.drawSize, meta = LEVEL_META[t.level];
  const qn = n / 8; // 资格赛晋级名额：正赛首轮末段各场比赛的奇数号签位
  const isQual = s => (s % 2 === 1) && s >= n - 2 * qn + 1;
  const dpos = []; // 直接入围签位（种子落位画布）
  for (let s = 0; s < n; s++) if (!isQual(s)) dpos.push(s);
  const dn = dpos.length; // = n * 7/8
  const slots = new Array(n).fill(null);
  const seedCount = Math.min(meta.seeds, directEntrants.length);
  const seeds = directEntrants.slice(0, seedCount);
  const rest = shuffle(directEntrants.slice(seedCount));
  slots[dpos[0]] = seeds[0].id;          // 1 号种子上半区顶端
  slots[dpos[dn - 1]] = seeds[1].id;     // 2 号种子下半区底端
  const q = Math.round(dn / 4), h = Math.round(dn / 2);
  const freeD = () => dpos.find(p => slots[p] === null);
  const place = (idx, pos) => { // 取整 + 防碰撞：7/8 入围区尺寸可能不整除区带基数
    pos = Math.round(pos);
    if (pos >= 0 && pos < dn && slots[dpos[pos]] === null) { slots[dpos[pos]] = seeds[idx].id; return true; }
    const f = freeD(); if (f != null) { slots[f] = seeds[idx].id; return true; }
    return false;
  };
  if (seedCount >= 4) { // 3/4 号随机分半区，但保证不同签位
    let p3 = nextRand() < 0.5 ? q : h, p4 = nextRand() < 0.5 ? q : h;
    if (p3 === p4) p4 = p3 === q ? h : q;
    place(2, p3); place(3, p4);
  }
  for (const start of [5, 9, 17]) { // 其余种子随机入区带（一次性洗牌，取整去重）
    const avail = Math.min(start === 5 ? 4 : start === 9 ? 8 : 16, seedCount - (start - 1));
    if (avail <= 0) continue;
    const per = start === 5 ? dn / 8 : start === 9 ? dn / 16 : dn / 32;
    const cnt = start === 5 ? 4 : start === 9 ? 8 : 16;
    const arr = [];
    for (let i = 0; i < cnt; i++) arr.push((2 * i + 1) * per);
    const pos = shuffle(arr).slice(0, avail);
    for (let i = 0; i < avail; i++) place(start - 1 + i, pos[i]);
  }
  let ri = 0;
  for (const p of dpos) if (slots[p] === null) slots[p] = rest[ri++].id; // 直接入围填满全部直接签位
  t.rounds[0].matches.forEach((m, i) => { m.a = slots[2 * i]; m.b = slots[2 * i + 1]; });
  const qs = qualEntrants.map(p => p.id);
  t.qual.rounds[0].matches.forEach((m, i) => { m.a = qs[2 * i]; m.b = qs[2 * i + 1]; }); // 资格赛首轮
  t.alive = dpos.map(p => slots[p]).concat(qs); // 正赛入围者与资格赛选手均视为"进行中"（占用周名额、排除新签）
  if (slots.includes(USER_ID) || qs.includes(USER_ID)) t.userStatus = 'alive';
}

/* ########################################################################
 * 第 5.4 章 · 年终总决赛（赛季积分榜前 8，2 组单循环 + 半决赛 + 决赛）
 * ######################################################################## */
// 总决赛入围并列处理（11.4）：积分相同先比相互交手，再比最近一站大满贯成绩
function finalsQualifiers() {
  const all = allByRanking();
  return all.slice(0, 8).map(p => p.id);
}
function buildFinals(event) {
  const top8 = finalsQualifiers();
  const t = { id: event.id, slotIndex: event.slotIndex, level: 'FINALS', name: event.name,
    status: 'inProgress', startDay: event.startDay, userStatus: 'notEntered', finals: true,
    day: 1, top8: top8.slice(), groups: { A: [], B: [] }, rr: [[], [], []], sf: [null, null], f: null, champion: null };
  const s = top8;
  t.groups.A.push(s[0]); t.groups.B.push(s[1]); // 1、2 号种子分居两组
  if (nextRand() < 0.5) { t.groups.A.push(s[2]); t.groups.B.push(s[3]); }
  else { t.groups.A.push(s[3]); t.groups.B.push(s[2]); } // 3/4 随机
  const rest = shuffle(s.slice(4)); // 5~8 随机入组
  t.groups.A.push(rest[0], rest[3]); t.groups.B.push(rest[1], rest[2]);
  const SCHED = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]; // 小组单循环三天赛程
  for (let d = 0; d < 3; d++) {
    for (const g of ['A', 'B']) for (const pr of SCHED[d]) {
      t.rr[d].push({ a: t.groups[g][pr[0]], b: t.groups[g][pr[1]], sets: [], winner: null, played: false, group: g });
    }
  }
  if (top8.includes(USER_ID)) t.userStatus = 'alive';
  return t;
}
// 小组 standings：胜场 → 相互交手 → 局分净胜 → 种子序
function groupStandings(t, g) {
  const ids = t.groups[g];
  const rows = ids.map(id => ({ id, w: 0, pl: 0, gw: 0, gl: 0 }));
  for (let d = 0; d < 3; d++) for (const m of t.rr[d]) {
    if (!m.played || m.group !== g) continue;
    const ra = rows.find(r => r.id === m.a), rb = rows.find(r => r.id === m.b);
    ra.pl++; rb.pl++;
    for (const [x, y] of m.sets) { ra.gw += x; ra.gl += y; rb.gw += y; rb.gl += x; }
    if (m.winner === m.a) ra.w++; else rb.w++;
  }
  const h2hWins = (x, y) => { // x 对 y 的相互交手胜场（11.4）
    let w = 0;
    for (let d = 0; d < 3; d++) for (const m of t.rr[d]) {
      if (!m.played || m.group !== g) continue;
      if (m.a === x && m.b === y && m.winner === x) w++;
      else if (m.a === y && m.b === x && m.winner === x) w++;
    }
    return w;
  };
  rows.sort((a, b) => b.w - a.w || h2hWins(b.id, a.id) - h2hWins(a.id, b.id)
    || (b.gw - b.gl) - (a.gw - a.gl) || t.top8.indexOf(a.id) - t.top8.indexOf(b.id));
  return rows;
}
// 玩家当天的总决赛对阵
function userFinalsMatch(t) {
  if (t.userStatus !== 'alive') return null;
  const d = t.day;
  let m = null;
  if (d <= 3) m = t.rr[d - 1].find(m => (m.a === USER_ID || m.b === USER_ID) && !m.played);
  else if (d === 4) m = t.sf.find(m => m && (m.a === USER_ID || m.b === USER_ID) && !m.played);
  else if (t.f && (t.f.a === USER_ID || t.f.b === USER_ID) && !t.f.played) m = t.f;
  return m || null;
}

/* ########################################################################
 * 第 6 章 · 积分与排名
 * ######################################################################## */
function totalPoints(p) { return p.points.reduce((s, r) => s + r.points, 0); }
function pointsFor(level, rowKey) { return (cfg().pointsTable[level] || {})[rowKey] || 0; }
// 6.3：积分记录携带到期赛日 = 新赛季同一站赛事开赛之日
function expiryFor(slotIndex) {
  const entry = state.season.calendar.find(e => e.slotIndex === slotIndex);
  if (!entry) return absDayOf(state.season.number + 1, 1); // 模板中已无此站 → 新赛季首日到期
  return absDayOf(state.season.number + 1, entry.startDay);
}
// 发放入账；positive 才落库（32 签首轮出局 0 分，6.1 附注）
function awardPoints(holder, tournament, pts, roundKey) {
  holder.lastPoints = pts;
  if (pts <= 0) return 0;
  // 到期赛日（6.3）：常规赛 = 下一赛季同一站开赛日；总决赛无对应站 = 下一赛季首日
  const exp = (tournament.finals || tournament.level === 'FINALS')
    ? absDayOf(state.season.number + 1, 1)
    : expiryFor(tournament.slotIndex);
  holder.points.push({ tournamentId: tournament.id, slotIndex: tournament.slotIndex, points: pts,
    expiryDay: exp, earnedDay: absDay(), round: roundKey });
  return pts;
}
// 11.1 ③：积分到期清算（当日比赛打完后，上赛季该站积分扣除）
function expirePoints(abs) {
  for (const p of state.players) p.points = p.points.filter(r => r.expiryDay > abs);
  state.user.points = state.user.points.filter(r => r.expiryDay > abs);
}
// 6.2：排名分 = 未过期积分之和；同分按最近一站成绩，其后 AI 优先于玩家（保证初始/重置恰为 1001，6.4/6.5）
function lastEarned(p) {
  let day = 0, pts = 0;
  for (const r of p.points) if (r.earnedDay > day) { day = r.earnedDay; pts = r.points; }
  return { day, pts };
}
function allByRanking() {
  return state.players.concat([state.user]).slice().sort((a, b) => a.ranking - b.ranking);
}
function recomputeRankings() {
  const all = state.players.concat([state.user]);
  all.forEach(p => { p.prevRanking = p.ranking; });
  all.sort((a, b) => {
    const ta = totalPoints(a), tb = totalPoints(b);
    if (tb !== ta) return tb - ta;
    const la = lastEarned(a), lb = lastEarned(b);
    if (lb.day !== la.day) return lb.day - la.day;
    if (lb.pts !== la.pts) return lb.pts - la.pts;
    const ua = a.id === USER_ID ? 1 : 0, ub = b.id === USER_ID ? 1 : 0;
    if (ua !== ub) return ua - ub;
    const sa = a.S || -1, sb = b.S || -1;
    if (sb !== sa) return sb - sa;
    return a.id - b.id;
  });
  // 6.5 纠错通道：积分清零 + 排名强制重置为 1001
  if (state.pendingRankReset) {
    const i = all.findIndex(p => p.id === USER_ID);
    if (i >= 0) { const u = all.splice(i, 1)[0]; all.push(u); }
    state.pendingRankReset = false;
  }
  all.forEach((p, i) => { p.ranking = i + 1; });
  const u = state.user;
  if (u.ranking < u.bestRanking) u.bestRanking = u.ranking;
}
/* ########################################################################
 * 第 3.4 章 · AI vs AI 模拟（与 3.3 完全相同的公式，逐局全量模拟）
 * ######################################################################## */
function simulateMatchAI(aId, bId, c) {
  const pa = playerById(aId), pb = playerById(bId);
  const Ma = genMatchM(pa.S, c), Mb = genMatchM(pb.S, c);
  let aw = 0, bw = 0; const sets = [];
  for (let k = 1; k <= 3 && aw < 2 && bw < 2; k++) {
    const ga = genSetScore(Ma, k, pa.f, c), gb = genSetScore(Mb, k, pb.f, c);
    sets.push([ga, gb]);
    if (ga > gb) aw++; else if (gb > ga) bw++; else (nextRand() < 0.5 ? aw++ : bw++); // AI 战平随机分胜负
  }
  return { sets, winner: aw === 2 ? aId : bId };
}

// 一场比赛落库：登记比分、胜者，落败者按轮次积分，胜者晋级传播
function onMatchDecided(t, ri, i, m, winner) {
  const loser = m.a === winner ? m.b : m.a;
  const roundName = t.rounds[ri].name;
  if (roundName === 'F') { // 决赛：亚军 + 冠军积分
    awardPoints(playerById(loser), t, pointsFor(t.level, 'final'), 'final');
    awardPoints(playerById(winner), t, pointsFor(t.level, 'winner'), 'winner');
    t.status = 'completed'; t.champion = winner;
    if (loser === USER_ID) t.userStatus = 'eliminated';
  } else {
    awardPoints(playerById(loser), t, pointsFor(t.level, ROW_KEY[roundName]), ROW_KEY[roundName]);
  }
  const ai = t.alive.indexOf(loser);
  if (ai >= 0) t.alive.splice(ai, 1);
  if (loser === USER_ID) t.userStatus = 'eliminated';
  if (ri + 1 < t.rounds.length) { // 胜者填入下一轮对应签位
    const nxt = t.rounds[ri + 1].matches[i >> 1];
    if ((i & 1) === 0) nxt.a = winner; else nxt.b = winner;
  }
}

// 模拟某赛事某一轮的所有 AI 比赛（玩家比赛已由交互阶段登记，跳过）
function simulateTournamentRound(t, ri) {
  if (ri < 0 || ri >= t.rounds.length) return;
  const c = cfg();
  const round = t.rounds[ri];
  round.matches.forEach((m, i) => {
    if (m.played || m.a == null || m.b == null) return;
    if (m.a === USER_ID || m.b === USER_ID) return; // 玩家对局已在结算①登记
    const res = simulateMatchAI(m.a, m.b, c);
    m.sets = res.sets; m.winner = res.winner; m.played = true;
    onMatchDecided(t, ri, i, m, res.winner);
  });
}

// 总决赛某一日：小组赛三天（每天每组各一场）→ 半决赛 → 决赛
function simulateFinalsDay(t) {
  const c = cfg();
  const sim = (m) => {
    if (!m || m.played || m.a == null || m.b == null) return;
    if (m.a === USER_ID || m.b === USER_ID) return; // 玩家比赛已登记
    const res = simulateMatchAI(m.a, m.b, c);
    m.sets = res.sets; m.winner = res.winner; m.played = true;
    awardPoints(playerById(res.winner), t, c.finalsPoints.rr, 'rr'); // 小组赛每胜 200
  };
  const d = t.day;
  if (d <= 3) {
    t.rr[d - 1].forEach(sim);
    if (d === 3) { // 小组赛收官：算排名、排半决赛
      const sA = groupStandings(t, 'A'), sB = groupStandings(t, 'B');
      t.sf[0] = { a: sA[0].id, b: sB[1].id, sets: [], winner: null, played: false };
      t.sf[1] = { a: sB[0].id, b: sA[1].id, sets: [], winner: null, played: false };
      for (const g of ['A', 'B']) { // 未进前二者出局（含玩家）
        const s = groupStandings(t, g);
        if (USER_ID === s[2].id || USER_ID === s[3].id) t.userStatus = 'eliminated';
      }
    }
  } else if (d === 4) {
    t.sf.forEach((m) => {
      if (!m || m.played) return;
      if (m.a === USER_ID || m.b === USER_ID) return;
      const res = simulateMatchAI(m.a, m.b, c);
      m.sets = res.sets; m.winner = res.winner; m.played = true;
      awardPoints(playerById(res.winner), t, c.finalsPoints.sf, 'sf'); // 半决赛胜 400
    });
    const w0 = t.sf[0].played ? t.sf[0].winner : null, w1 = t.sf[1].played ? t.sf[1].winner : null;
    if (w0 != null && w1 != null) t.f = { a: w0, b: w1, sets: [], winner: null, played: false };
    t.sf.forEach(m => { if (m && m.played && m.winner !== USER_ID && (m.a === USER_ID || m.b === USER_ID)) t.userStatus = 'eliminated'; });
  } else if (d === 5) {
    if (t.f && !t.f.played && t.f.a !== USER_ID && t.f.b !== USER_ID) {
      const res = simulateMatchAI(t.f.a, t.f.b, c);
      t.f.sets = res.sets; t.f.winner = res.winner; t.f.played = true;
      awardPoints(playerById(res.winner), t, c.finalsPoints.f, 'f'); // 决赛胜 500
    }
    if (t.f && t.f.played) {
      t.status = 'completed'; t.champion = t.f.winner;
      if (t.f.a === USER_ID || t.f.b === USER_ID) t.userStatus = t.f.winner === USER_ID ? 'champion' : 'eliminated';
    }
  }
  t.day++;
}

/* ########################################################################
 * 第 4 章 · 玩家对局：登记玩家比赛结果
 * ######################################################################## */
function updateStreak() { // 4.4：streak 按自然日统计
  const u = state.user, t = todayStr();
  if (u.lastPlayedDate === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  u.streak = (u.lastPlayedDate === fmtDate(y)) ? u.streak + 1 : 1;
  u.lastPlayedDate = t;
}
// res: {tournamentId, finals, day, roundIdx, oppId, won, sets:[{user,ai}]}
function applyPlayerResult(res) {
  const t = state.tournaments.find(x => x.id === res.tournamentId);
  let roundLabel = '', pts = 0;
  if (res.qualRound != null) { // 玩家资格赛（一轮一天，与正赛同构；胜场得 qualPoints，落败即本站出局）
    const qd = res.qualRound;
    const m = t.qual.rounds[qd].matches.find(m => m.a === USER_ID || m.b === USER_ID);
    const userIsA = m.a === USER_ID;
    m.sets = res.sets.map(s => userIsA ? [s.user, s.ai] : [s.ai, s.user]);
    m.winner = res.won ? USER_ID : res.oppId; m.played = true;
    roundLabel = 'Q' + (qd + 1);
    pts = awardPoints(state.user, t, (cfg().qualPoints && cfg().qualPoints[t.level]) || 0, 'qual');
    const loser = res.won ? res.oppId : USER_ID;
    const ai = t.alive.indexOf(loser);
    if (ai >= 0) t.alive.splice(ai, 1);
    if (res.won) {
      if (qd + 1 < 3) { // 晋级下一轮资格赛
        const i = t.qual.rounds[qd].matches.indexOf(m);
        const nxt = t.qual.rounds[qd + 1].matches[i >> 1];
        if ((i & 1) === 0) nxt.a = USER_ID; else nxt.b = USER_ID;
      } else t.qual.winners.push(USER_ID); // 决胜轮晋级 = 正赛资格赛签位（assignQualifiers 落位）
    } else {
      t.userStatus = 'eliminated';
      // 胜出的对手照常晋级传播（与 simulateQualRound 同构）
      awardPoints(playerById(res.oppId), t, (cfg().qualPoints && cfg().qualPoints[t.level]) || 0, 'qual');
      if (qd + 1 < 3) {
        const i = t.qual.rounds[qd].matches.indexOf(m);
        const nxt = t.qual.rounds[qd + 1].matches[i >> 1];
        if ((i & 1) === 0) nxt.a = res.oppId; else nxt.b = res.oppId;
      } else t.qual.winners.push(res.oppId);
    }
  } else if (t.finals) {
    const d = res.day;
    let m;
    if (d <= 3) m = t.rr[d - 1].find(m => m.a === USER_ID || m.b === USER_ID);
    else if (d === 4) m = t.sf.find(m => m.a === USER_ID || m.b === USER_ID);
    else m = t.f;
    const userIsA = m.a === USER_ID;
    m.sets = res.sets.map(s => userIsA ? [s.user, s.ai] : [s.ai, s.user]);
    m.winner = res.won ? USER_ID : res.oppId; m.played = true;
    roundLabel = d <= 3 ? 'RR' + d : (d === 4 ? 'FINALSF' : 'FINALF');
    if (res.won) pts = awardPoints(state.user, t, d <= 3 ? cfg().finalsPoints.rr : d === 4 ? cfg().finalsPoints.sf : cfg().finalsPoints.f, 'finals');
    else if (d >= 4) t.userStatus = 'eliminated';
  } else {
    const ri = res.roundIdx, round = t.rounds[ri];
    const i = round.matches.findIndex(m => m.a === USER_ID || m.b === USER_ID);
    const m = round.matches[i];
    const userIsA = m.a === USER_ID;
    m.sets = res.sets.map(s => userIsA ? [s.user, s.ai] : [s.ai, s.user]);
    m.winner = res.won ? USER_ID : res.oppId; m.played = true;
    roundLabel = round.name;
    if (res.won) {
      if (round.name === 'F') { pts = awardPoints(state.user, t, pointsFor(t.level, 'winner'), 'winner'); t.status = 'completed'; t.champion = USER_ID; t.userStatus = 'champion'; }
      else { const nxt = t.rounds[ri + 1].matches[i >> 1]; if ((i & 1) === 0) nxt.a = USER_ID; else nxt.b = USER_ID; }
    } else {
      pts = awardPoints(state.user, t, pointsFor(t.level, ROW_KEY[round.name]), ROW_KEY[round.name]);
      t.userStatus = 'eliminated';
      const ai = t.alive.indexOf(USER_ID); if (ai >= 0) t.alive.splice(ai, 1);
      if (ri + 1 < t.rounds.length) { const nxt = t.rounds[ri + 1].matches[i >> 1]; if ((i & 1) === 0) nxt.a = res.oppId; else nxt.b = res.oppId; }
    }
  }
  state.history.push({ season: state.season.number, day: state.season.day, tournamentId: t.id,
    level: t.level, round: roundLabel, oppId: res.oppId, result: res.won ? 'W' : 'L',
    sets: res.sets.map(s => [s.user, s.ai]), pointsEarned: pts,
    tournamentName: t.name, oppRank: playerById(res.oppId).ranking }); // 9.4 历史列表快照（旧档缺省回退查签表/现排名）
  updateStreak();
}

/* ########################################################################
 * 11.1 · 每日结算顺序：
 *   ① 玩家比赛 → ② 批量模拟当日所有 AI 赛事 → ③ 积分到期清算 → ④ 重算排名 → ⑤ 生成明日对阵
 * （训练休息日：跳过①，其余照常；赛季时钟仅在完赛或点过休息日时前进，4.4）
 * ######################################################################## */
function settleDay(playerResult) {
  if (playerResult) applyPlayerResult(playerResult); // ①
  const abs = absDay();
  simulateDayRounds(state.season.day); // ②
  expirePoints(abs); // ③
  if (state.pendingRankReset) state.user.points = []; // 6.5：打完当日赛程后清零生效
  recomputeRankings(); // ④
  state.user.pointsLog.push({ day: abs, pts: totalPoints(state.user) });
  generateTomorrow(); // ⑤
  save();
}

// 决定玩家某日比赛（或 null = 训练休息日，5.3.4 兜底分支）
// 5.3：玩家的双卡入围判定 —— 与 AI 同一套规则（正赛/资格赛双门槛 + 直接区按排名竞争），无"必入签"特权
// 排名 ≤ 正赛门槛 → 正赛资格：在正赛合格池（AI 受周限额约束；玩家豁免、不适用出勤率）中按排名竞争 7/8 直接区
// （位次 < 直接名额 → 直通正赛；否则落入资格赛）；正赛门槛 < 排名 ≤ 资格赛门槛 → 资格赛；否则不可报。
// ITF 特例：正赛池同为前 300，但直接区按"弱者优先"（排名数值最高）取人；资格赛无限制。
function playerEntryFor(e) {
  const c = cfg().entryCutoff[e.level];
  if (!c) return null;
  const elig = entryEligibility(e.level, state.user.ranking);
  if (!elig) return null;
  if (elig === 'qual') return 'qual';
  const week = weekOf(state.season.day);
  const pool = entryPool({ level: e.level }).filter(p => countWeekEvents(p.id, week) < cfg().maxEventsPerWeek)
    .filter(p => p.ranking <= c.main && (c.excludeTop == null || p.ranking > c.excludeTop))
    .concat([state.user]); // 玩家池仍按限额过滤（席位竞争口径）
  pool.sort(byDirOrder(e.level));
  const pos = pool.findIndex(p => p.id === USER_ID);
  const directCount = LEVEL_META[e.level].drawSize * 7 / 8;
  return pos >= 0 && pos < directCount ? 'direct' : 'qual';
}

function buildUserMatchInner(aliveT, target) {
  if (aliveT) {
    let opp = null;
    if (aliveT.finals) {
      const m = userFinalsMatch(aliveT);
      if (m) opp = m.a === USER_ID ? m.b : m.a;
      if (opp == null) return null;
      return { tournamentId: aliveT.id, finals: true, day: aliveT.day, oppId: opp,
        sets: [], uw: 0, ow: 0, nextSet: 1 };
    }
    const qd = state.season.day - aliveT.startDay;
    if (aliveT.userEntry === 'qual' && qd >= 0 && qd <= 2) { // 玩家资格赛：一轮一天
      const m = aliveT.qual.rounds[qd].matches.find(m => (m.a === USER_ID || m.b === USER_ID) && !m.played);
      if (!m) return null;
      opp = m.a === USER_ID ? m.b : m.a;
      return { tournamentId: aliveT.id, qualRound: qd, oppId: opp, oppM: null, target: null,
        sets: [], uw: 0, ow: 0, nextSet: 1 };
    }
    const ri = state.season.day - aliveT.startDay - 3; // 正赛轮次于资格赛 3 天之后开打（5.3）
    if (ri < 0) return null; // 已直通、正赛未开始（直通一律快进，不会进入此态；防御保留）
    const m = aliveT.rounds[ri] && aliveT.rounds[ri].matches.find(m => m.a === USER_ID || m.b === USER_ID);
    if (!m) return null;
    opp = m.a === USER_ID ? m.b : m.a;
    return { tournamentId: aliveT.id, finals: false, roundIdx: ri, oppId: opp,
      sets: [], uw: 0, ow: 0, nextSet: 1 };
  }
  if (target) {
    const t = state.tournaments.find(x => x.id === target.id);
    if (t.userEntry === 'qual') { // 当日资格赛第 1 轮即开打
      const m = t.qual.rounds[0].matches.find(m => (m.a === USER_ID || m.b === USER_ID) && !m.played);
      if (!m) return null;
      const opp = m.a === USER_ID ? m.b : m.a;
      return { tournamentId: t.id, qualRound: 0, oppId: opp,
        sets: [], uw: 0, ow: 0, nextSet: 1 };
    }
    const ri = state.season.day - t.startDay - 3;
    if (ri < 0) return null; // 直通、正赛未开始（防御保留）
    const m = t.rounds[ri] && t.rounds[ri].matches.find(m => m.a === USER_ID || m.b === USER_ID);
    if (!m) return null;
    const opp = m.a === USER_ID ? m.b : m.a;
    return { tournamentId: t.id, finals: false, roundIdx: ri, oppId: opp,
      sets: [], uw: 0, ow: 0, nextSet: 1 };
  }
  return null;
}
// 比赛创建即按 3.3 公式生成对手整场的 M 与 3 局成绩并持久化（4.1 盲打：先录入、确认后才揭晓展示）
function rollTodayScores(m) {
  if (m && m.oppM == null && m.oppId != null) {
    const opp = playerById(m.oppId);
    m.oppM = genMatchM(opp.S, cfg());
    m.aiSets = [1, 2, 3].map(k => genSetScore(m.oppM, k, opp.f, cfg()));
  }
  return m;
}
function buildUserMatch(aliveT, target) {
  return rollTodayScores(buildUserMatchInner(aliveT, target));
}

// 玩家入签（按位次判定形式）：直通 → 正赛直接区；否则 → 资格赛签表。顶替位次最低的中选者
function forceUserInto(t, form) {
  if (form === 'direct') {
    let ents = t._directEnts;
    if (!ents.some(p => p.id === USER_ID)) {
      ents = ents.slice(0, Math.max(0, ents.length - 1)).concat([state.user]);
      ents.sort((a, b) => a.ranking - b.ranking);
    }
    return ents;
  }
  let qents = t._qualEnts;
  if (!qents.some(p => p.id === USER_ID)) {
    qents = qents.slice(0, Math.max(0, qents.length - 1)).concat([state.user]);
    qents.sort((a, b) => t.level === 'ITF' ? b.ranking - a.ranking : a.ranking - b.ranking);
  }
  return qents;
}

// 某日新开赛赛事建签（userEntry = {event, form}：玩家按位次进入正赛/资格赛；5.3）
function generateDayEvents(rel, userEntry) {
  const starting = state.season.calendar.filter(e => e.startDay === rel);
  for (const e of starting) { // 级别高者先建签（签表按排名优先填满高级别赛事）
    if (e.level === 'FINALS') { state.tournaments.push(buildFinals(e)); continue; }
    const t = createTournament(e);
    t._directEnts = selectDirect(t, false);
    const directIds = new Set(t._directEnts.map(p => p.id));
    t._qualEnts = selectQualifiers(t, directIds);
    if (userEntry && userEntry.event === e) {
      t.userEntry = userEntry.form;
      if (userEntry.form === 'direct') fillDraw(t, forceUserInto(t, 'direct'), t._qualEnts);
      else fillDraw(t, t._directEnts, forceUserInto(t, 'qual'));
      delete t._directEnts; delete t._qualEnts;
    } else {
      fillDraw(t, t._directEnts, t._qualEnts);
      delete t._directEnts; delete t._qualEnts;
    }
    state.tournaments.push(t);
  }
}

// 资格赛某轮模拟：AI 全量逐局模拟，胜场按级别发资格赛积分（6.1），晋级者进入下一轮
function simulateQualRound(t, qd) {
  const c = cfg();
  const round = t.qual.rounds[qd];
  round.matches.forEach((m, i) => {
    if (m.played || m.a == null || m.b == null) return;
    if (m.a === USER_ID || m.b === USER_ID) return; // 玩家豁免资格赛，不会出现在资格赛签表
    const res = simulateMatchAI(m.a, m.b, c);
    m.sets = res.sets; m.winner = res.winner; m.played = true;
    awardPoints(playerById(res.winner), t, (c.qualPoints && c.qualPoints[t.level]) || 0, 'qual');
    const loser = m.a === res.winner ? m.b : m.a;
    const ai = t.alive.indexOf(loser);
    if (ai >= 0) t.alive.splice(ai, 1);
    if (qd + 1 < 3) { const nxt = t.qual.rounds[qd + 1].matches[i >> 1]; if ((i & 1) === 0) nxt.a = res.winner; else nxt.b = res.winner; }
    else t.qual.winners.push(res.winner);
  });
}

// 资格赛收官：晋级者（= 正赛名额 1/8）随机散开落入正赛首轮末段各场（每场一个，对位直接入围者）
function assignQualifiers(t) {
  const qn = t.drawSize / 8;
  if (t.qual.winners.length < qn || t.qualAssigned) return;
  const ids = shuffle(t.qual.winners.slice());
  const n = t.drawSize;
  for (let k = 0; k < qn; k++) {
    const s = n - 2 * (qn - k) + 1; // 末段各首轮比赛的奇数号签位
    const m = t.rounds[0].matches[s >> 1];
    if ((s & 1) === 0) m.a = ids[k]; else m.b = ids[k];
  }
  t.qualAssigned = true;
}

// 模拟某日全部赛事轮次（11.1 ②；预模拟与每日结算共用）：前 3 天资格赛，其后正赛逐轮
function simulateDayRounds(rel) {
  for (const t of state.tournaments) {
    if (t.status !== 'inProgress') continue;
    if (t.finals) { if (rel === t.startDay + t.day - 1) simulateFinalsDay(t); continue; }
    const qd = rel - t.startDay;
    if (qd >= 0 && qd <= 2) { // 资格赛三天
      simulateQualRound(t, qd);
      if (qd === 2) assignQualifiers(t);
      continue;
    }
    simulateTournamentRound(t, qd - 3);
  }
}

// 直通快进（5.3）：玩家直通正赛后，批量推进资格赛 3 个赛日——逐日复用 settle 的核心步骤
// （全量模拟 → 积分到期 → 重算排名），期间的其他新开赛赛事照常建签，保证与逐日推进逐字段一致。
// 随后生成「资格赛战报」（晋级名单 / 爆冷·高分精选 / 其他赛事冠军速报）。
function fastForwardQualDays(t, days) {
  const report = { tournamentId: t.id, fromDay: state.season.day, winners: [],
    upsets: [], highScores: [], champions: [], _comp: new Set(), _seen: new Set() };
  for (let k = 0; k < days; k++) {
    const rel = state.season.day;
    simulateDayRounds(rel); // ② 全量模拟当日（本站资格赛各轮 + concurrent 赛事）
    expirePoints(absDay()); // ③ 积分到期清算
    recomputeRankings();    // ④ 重算排名
    collectQualReport(report, rel);
    state.user.pointsLog.push({ day: absDay(), pts: totalPoints(state.user) });
    if (k < days - 1) {
      state.season.day++;
      generateDayEvents(state.season.day, null); // 期间次日新开赛赛事照常建签（玩家已持有席位）
    }
  }
  report.winners = t.qual.winners.slice();
  delete report._comp; delete report._seen;
  state.qualReport = report;
  // 战报旗标不存档：清理扫描标记
  for (const x of state.tournaments) {
    if (x.finals) continue;
    for (const qr of x.qual.rounds) for (const m of qr.matches) delete m._rep;
    for (const r of x.rounds) for (const m of r.matches) delete m._rep;
  }
}

// 战报采集：爆冷（前 100 高手出局 / 位次差 ≥150 的以下克上）、单局高比分（≥18 或 双方合计 ≥30）、冠军速报
function collectQualReport(report, rel) {
  for (const t of state.tournaments) {
    if (!t.finals && t.status === 'completed' && t.champion != null && !report._comp.has(t.id)
        && t.id !== report.tournamentId) {
      report._comp.add(t.id);
      report.champions.push({ name: t.name, level: t.level, champion: t.champion });
    }
    if (t.finals) continue;
    const scan = (m, roundName) => {
      if (!m.played || m._rep) return;
      m._rep = true;
      const w = playerById(m.winner), l = playerById(m.a === m.winner ? m.b : m.a);
      if (report.upsets.length < 8 && w.ranking > l.ranking && (l.ranking <= 100 || w.ranking >= l.ranking + 150))
        report.upsets.push({ tn: t.name, round: roundName, w: w.name, wR: w.ranking, l: l.name, lR: l.ranking });
      for (const [x, y] of m.sets) {
        const hi = Math.max(x, y);
        if (report.highScores.length < 8 && (hi >= 18 || x + y >= 30))
          report.highScores.push({ tn: t.name, round: roundName,
            a: playerById(m.a).name, b: playerById(m.b).name, s: x + ':' + y });
      }
    };
    t.qual.rounds.forEach((qr, qd) => qr.matches.forEach(m => scan(m, ROUND_LABEL['Q' + (qd + 1)])));
    t.rounds.forEach(r => r.matches.forEach(m => scan(m, ROUND_LABEL[r.name])));
  }
}

// 为某个赛日建签 / 建总决赛；玩家预约（state.userEntry）在开赛日兑现：建签时必入签（forceUserInto）
function advanceToDay(rel) {
  const starting = state.season.calendar.filter(e => e.startDay === rel);
  const aliveT = state.tournaments.find(t => t.status === 'inProgress' && t.userStatus === 'alive');
  let userEntry = null;
  if (!aliveT && state.userEntry) {
    if (state.userEntry.startDay === rel) { // 预约兑现：形式报名时已锁定
      const ev = state.season.calendar.find(e => e.id === state.userEntry.eventId);
      if (ev) userEntry = { event: ev, form: state.userEntry.form };
      state.userEntry = null;
    } else if (state.userEntry.startDay < rel) state.userEntry = null; // 兜底：错过开赛日（理论不发生）
  }
  generateDayEvents(rel, userEntry);
  if (!FF_DISABLED && userEntry && userEntry.form === 'direct') { // 直通 → 自动快进资格赛 3 天，战报后直接进入正赛 R1
    const t = state.tournaments.find(x => x.id === userEntry.event.id);
    fastForwardQualDays(t, 3);
    state.season.day = rel + 3;
    generateDayEvents(rel + 3, null); // 正赛首日的其他新开赛赛事照常建签
    state.today = buildUserMatch(state.tournaments.find(x => x.id === t.id), null);
    return;
  }
  state.today = buildUserMatch(aliveT, userEntry && { id: userEntry.event.id });
}

/* ########################################################################
 * 玩家手动报名（5.3）：选择卡 → 锁定席位（userEntry，形式报名时计算并锁定）
 * 远期预约可快进或取消；当日赛事签表已建时顶替插入（单席位制）
 * ######################################################################## */
// 把玩家插入已建签赛事（顶替位次最低的中选者）；返回玩家今日比赛对象或 null（直通等待/正赛未开始）
function insertUserIntoDraw(t, form) {
  const displace = (matches) => { // 找位次最低者换人（ITF 逆序取人 → 位次"最高"即 ranking 最大者）
    let worst = null;
    matches.forEach((m, mi) => { for (const slot of ['a', 'b']) {
      const id = m[slot];
      if (id == null || id === USER_ID) continue;
      const p = playerById(id);
      if (!worst || (t.level === 'ITF' ? p.ranking > worst.p.ranking : p.ranking < worst.p.ranking)) worst = { m, slot, p };
    }});
    return worst;
  };
  const swap = (worst) => {
    worst.m[worst.slot] = USER_ID;
    const ai = t.alive.indexOf(worst.p.id);
    if (ai >= 0) t.alive.splice(ai, 1);
    t.alive.push(USER_ID);
    t.userStatus = 'alive'; t.userEntry = form;
  };
  if (form === 'qual') {
    const w = displace(t.qual.rounds[0].matches);
    if (w) swap(w);
    const m = t.qual.rounds[0].matches.find(m => m.a === USER_ID || m.b === USER_ID);
    return m ? rollTodayScores({ tournamentId: t.id, qualRound: 0, oppId: m.a === USER_ID ? m.b : m.a,
      sets: [], uw: 0, ow: 0, nextSet: 1 }) : null;
  }
  const w = displace(t.rounds[0].matches);
  if (w) swap(w);
  const ri = state.season.day - t.startDay - 3;
  if (ri < 0) return null; // 直通等待（realize 会接管快进）
  const m = t.rounds[ri] && t.rounds[ri].matches.find(m => m.a === USER_ID || m.b === USER_ID);
  return m ? rollTodayScores({ tournamentId: t.id, finals: false, roundIdx: ri, oppId: m.a === USER_ID ? m.b : m.a,
    sets: [], uw: 0, ow: 0, nextSet: 1 }) : null;
}

// 兑现预约：赛事未建签则建签（必入签），已建签则顶替插入；直通 → 快进资格赛 3 天 + 战报
function realizeCommit() {
  const c = state.userEntry;
  if (!c) return null;
  state.userEntry = null;
  const ev = state.season.calendar.find(e => e.id === c.eventId);
  let t = tournamentOf(c.eventId);
  if (!t) { generateDayEvents(state.season.day, { event: ev, form: c.form }); t = tournamentOf(c.eventId); }
  else if (!t.finals) { state.today = insertUserIntoDraw(t, c.form); }
  if (c.form === 'direct') {
    if (!FF_DISABLED) {
      fastForwardQualDays(t, 3);
      state.season.day = t.startDay + 3;
      generateDayEvents(state.season.day, null);
    }
    state.today = buildUserMatch(tournamentOf(c.eventId), null);
  }
  return state.today;
}

// 玩家锁定报名（选择卡点选）：形式按报名时排名计算并锁定；当日赛事立即兑现，远期进入等待卡
function commitEntry(eventId) {
  if (state.userEntry) return 'busy'; // 单席位：预约中不可再报
  if (state.tournaments.some(t => t.status === 'inProgress' && t.userStatus === 'alive')) return 'alive';
  const e = state.season.calendar.find(x => x.id === eventId);
  if (!e || e.level === 'FINALS') return 'bad';
  const form = playerEntryFor(e);
  if (!form) return 'cutoff';
  state.userEntry = { eventId: e.id, level: e.level, name: e.name, startDay: e.startDay, form, enteredDay: state.season.day };
  if (e.startDay === state.season.day) { realizeCommit(); return 'ok'; }
  save();
  return 'wait';
}

// 远期预约快进：批量模拟今日 → 开赛日之间的世界赛程（逐日结算，与快进机制同构），生成跳过简报
function fastForwardTo(targetDay) {
  const report = { fromDay: state.season.day, days: targetDay - state.season.day, champions: [], _comp: new Set() };
  while (state.season.day < targetDay) {
    const rel = state.season.day;
    simulateDayRounds(rel); // ②
    expirePoints(absDay()); // ③
    recomputeRankings();    // ④
    for (const t of state.tournaments) {
      if (!t.finals && t.status === 'completed' && t.champion != null && !report._comp.has(t.id)) {
        report._comp.add(t.id);
        report.champions.push({ name: t.name, level: t.level, champion: t.champion });
      }
    }
    state.user.pointsLog.push({ day: absDay(), pts: totalPoints(state.user) });
    state.season.day++;
    generateDayEvents(state.season.day, null);
  }
  delete report._comp;
  state.skipReport = report;
}

// ⑤ 生成明日对阵；跨赛季则滚动开启新赛季（6.3 保分制，积分不清零）
function generateTomorrow() {
  if (state.season.day + 1 > seasonLength()) { newSeason(); return; }
  state.season.day++;
  advanceToDay(state.season.day);
}

/* ########################################################################
 * 世界初始化：第 0 赛季预模拟（5.5）—— 不含玩家，完整跑完一个历史赛季，
 * 所得积分按保分制落库（到期日 = 第 1 赛季同一站开赛日；总决赛积分第 1 赛季首日到期）
 * ######################################################################## */
function simulatePreseason() {
  const t0 = Date.now();
  state.season.number = 0;   // absDayOf(0,·) 为负、expiryFor 自然指向第 1 赛季
  state.season.day = 0;
  state.tournaments = [];
  for (let day = 1; day <= seasonLength(); day++) { // 逐日建签 + 全量模拟 + 重算排名（驱动次日签表）；与正式赛季同一套参赛规则（5.3）
    state.season.day = day;
    generateDayEvents(day);
    simulateDayRounds(day);
    recomputeRankings();
  }
  const fin = state.tournaments.find(t => t.finals);
  state.season0 = { // 供「我的数据」页展示的历史赛季信息
    championId: fin && fin.champion != null ? fin.champion : null,
    gsChampionIds: state.tournaments.filter(t => t.level === 'GS').map(t => t.champion),
  };
  state.tournaments = [];  // 第 0 赛季签表不入库，积分记录保留
  state.season.number = 1; // 回到第 1 赛季第 1 天
  state.season.day = 1;
  recomputeRankings();
  state.preseasonMs = Date.now() - t0; // 性能自检（毫秒）
}

/* ########################################################################
 * 赛季滚动：收官后立即开启新赛季（5.1 / 6.3 / 11.7）
 * ######################################################################## */
// 赛季收官总结快照（滚动前捕获：历史/签表/积分都还在）
function captureSeasonSummary() {
  const sn = state.season.number;
  const hist = state.history.filter(h => h.season === sn);
  const wins = hist.filter(h => h.result === 'W').length;
  const titles = hist.filter(h => h.result === 'W' && (h.round === 'W' || h.round === 'FINALF'))
    .map(h => { const t = state.tournaments.find(x => x.id === h.tournamentId);
      return { name: t ? t.name : h.tournamentId, level: h.level }; });
  const byLevel = {};
  for (const r of state.user.points) {
    const t = state.tournaments.find(x => x.id === r.tournamentId);
    const lv = t ? t.level : '其他';
    byLevel[lv] = (byLevel[lv] || 0) + r.points;
  }
  state.seasonSummary = { season: sn, rank: state.user.ranking, best: state.user.bestRanking,
    wins, losses: hist.length - wins, titles, pts: totalPoints(state.user), byLevel };
}
function newSeason() {
  captureSeasonSummary(); // 赛季收官总结（9.1：最终排名/战绩/冠军列表/积分构成）
  state.season.number++;
  state.config.current = deepCopy(state.config.queued); // 11.7：入队配置新赛季首日生效
  state.season.calendar = buildCalendar(state.config.current.calendarTemplate);
  // 6.3：重算所有未过期积分的到期日 = 新赛季同一站开赛日（按 slotIndex 对应）
  const firstAbs = absDayOf(state.season.number, 1);
  const fix = rec => {
    if (rec.slotIndex == null || rec.slotIndex < 0) { rec.expiryDay = firstAbs; return; } // 无对应站
    const e = state.season.calendar.find(e => e.slotIndex === rec.slotIndex);
    rec.expiryDay = (e && e.level !== 'FINALS') ? absDayOf(state.season.number, e.startDay) : firstAbs; // 总决赛积分新赛季首日到期
  };
  for (const p of state.players) p.points.forEach(fix);
  state.user.points.forEach(fix);
  // 9.4 跨赛季对阵可查：往届赛事完整签表归档保留（容量兜底见 enforceArchiveBudget）
  state.archive = (state.archive || []).concat(state.tournaments.map(t => Object.assign({ archivedSeason: state.season.number - 1 }, t))); // number 已自增，旧赛季号需 -1
  state.tournaments = [];
  state.today = null;
  state.userEntry = null;   // 预约不跨赛季（收官周无远期可报，理论残留在此取消）
  state.skipReport = null;
  state.askRetest = true; // 第 7 章：新赛季提示复测力竭次数
  state.season.day = 1;
  advanceToDay(1);
  save();
  enforceArchiveBudget(); // 9.4 归档后容量兜底（超限裁剪最早赛季的 AI 逐局比分）
}
/* ########################################################################
 * 第 8 章 · 存档（localStorage，schema v1）与备份
 * ######################################################################## */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch (e) { toast('存档失败：' + e.message); }
}
// 11.6：启动校验 schema 版本与 JSON 完整性
function validateSave(o) {
  return !!o && typeof o === 'object' && o.version === 1
    && Array.isArray(o.players) && o.players.length > 0
    && o.user && typeof o.user.maxReps === 'number'
    && o.season && Array.isArray(o.season.calendar) && o.season.calendar.length > 0
    && Array.isArray(o.tournaments) && Array.isArray(o.history)
    && o.config && o.config.current && o.config.queued;
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { /* 忽略 */ }
  if (!raw) return 'none';
  try {
    const o = JSON.parse(raw);
    if (!validateSave(o)) return 'corrupt';
    state = o;
    // 兼容旧版存档：补齐后续版本新增的配置键
    const dft = defaultConfig();
    for (const k of Object.keys(dft)) {
      if (state.config.current[k] === undefined) state.config.current[k] = deepCopy(dft[k]);
      if (state.config.queued[k] === undefined) state.config.queued[k] = deepCopy(dft[k]);
    }
    // 旧档 AI 无 attendance 字段：按 id 确定性回填 U[attendanceRange]
    const [amin, amax] = state.config.current.attendanceRange || [0.4, 1.0];
    for (const p of state.players) {
      if (typeof p.attendance !== 'number')
        p.attendance = +((amin + ((p.id * 2654435761 >>> 0) % 1000) / 1000 * (amax - amin)).toFixed(3));
    }
    if (!Array.isArray(state.archive)) state.archive = []; // 9.4 旧档无归档字段
    // 4.1 盲打迁移：旧 pending（已亮靶待录入）作废亮靶——按既有 oppM/公式生成 3 局成绩持久化，该局改走先录入
    if (state.today && state.today.aiSets == null) {
      const t = state.today, opp = playerById(t.oppId);
      if (t.oppM == null) t.oppM = genMatchM(opp.S, state.config.current);
      t.aiSets = [1, 2, 3].map(k => genSetScore(t.oppM, k, opp.f, state.config.current));
    }
    if (state.today) delete state.today.target; // 已亮出的靶作废（分数不展示，成绩本身不变）
    // 旧版"直通等待期"存档迁移：自动快进剩余资格赛天数，落到正赛 R1（与新版行为一致）
    const pending = state.tournaments.find(t => t.status === 'inProgress' && t.userStatus === 'alive'
      && !t.finals && t.userEntry === 'direct' && state.season.day - t.startDay < 3);
    if (pending && !state.qualReport) {
      const days = 3 - (state.season.day - pending.startDay);
      fastForwardQualDays(pending, days);
      state.season.day = pending.startDay + 3;
      generateDayEvents(state.season.day, null);
      state.today = buildUserMatch(state.tournaments.find(x => x.id === pending.id), null);
      save();
    }
    return 'ok';
  } catch (e) { return 'corrupt'; }
}
// 首次启动：输入力竭次数 → 建档（第 7 章），生成 1000 名 AI + 赛历 + 第 1 天对阵
function createProfile(maxReps) {
  // 11.7：重新开始建新存档时，设置页当前值（含排队修改，prefs.config）立即生效；否则用默认配置

  state = {

      streak: 0, lastPlayedDate: null, points: [], ranking: 1001, prevRanking: 1001,

    tournaments: [],

    history: [],
    pendingRankReset: false,

    season0: null,       // 第 0 赛季（预模拟）信息，供「我的数据」页展示
    preseasonMs: 0,      // 预模拟耗时（性能自检）

    skipReport: null,    // 远期报名快进后的跳过简报
    userEntry: null,     // 玩家手动报名的预约（开赛日兑现；单席位制）
    seasonSummary: null, // 赛季收官总结快照（滚动时捕获，供总结视图展示）
    ui: { tab: 'today', rankPage: 0, rankQuery: '', calId: null, calView: null },
  };
  state.players = genPool(state.config.current);

  if (state.config.current.preseason) simulatePreseason(); // 5.5：AI 带历史赛季积分开局
  else recomputeRankings(); // preseason=false：全员 0 分
  for (const p of state.players.concat([state.user])) p.prevRanking = p.ranking; // 首个赛日前涨跌基线归零
  advanceToDay(1);
  save();
}

// 9.5：导入 JSON 备份（先校验，损坏则拒绝且不覆盖，11.6）
function importSave(jsonText) {
  let o;
  try { o = JSON.parse(jsonText); } catch (e) { return '文件不是有效的 JSON'; }
  if (!validateSave(o)) return '存档校验失败（版本或结构不符），未导入';
  state = o;
  save();

  return null;
}
// 9.5：重新开始（清空存档；调用方负责二次确认）
function resetAll() {
  // 重新开始前把设置页当前值（含排队修改）存入偏好键，重建时立即生效（11.7）
  if (state && state.config) savePrefs(Object.assign(loadPrefs(), { config: state.config.queued }));
  localStorage.removeItem(SAVE_KEY);

}
// 下一场可报名赛事（无赛可报时展示）：往后扫描赛历，按门槛链找最近可报站
function nextEnterableEvent() {
  for (let d = state.season.day + 1; d <= seasonLength(); d++) {
    const evs = state.season.calendar.filter(e => e.startDay === d && e.level !== 'FINALS')
      .sort((a, b) => LEVEL_META[b.level].rank - LEVEL_META[a.level].rank);
    for (const e of evs) {
      const c = cfg();
      if (entryEligibility(e.level, state.user.ranking)) return { event: e, in: d - state.season.day };
    }
  }
  return null;
}

// 9.4 存档体积兜底：localStorage 约 4MB 上限，按 3.5MB 预算从最早归档赛季起
// 裁剪 AI 之间比赛的逐局比分（setsTrimmed：胜负/晋级结构保留；玩家比赛不裁剪）
function enforceArchiveBudget(limit) {
  const LIM = limit || 3500000;
  const size = () => { try { return (localStorage.getItem(SAVE_KEY) || '').length; } catch (e) { return 0; } };
  const trimTournament = (t) => {
    let n = 0;
    const trim = (m) => { if (m && m.played && m.sets.length && m.a !== USER_ID && m.b !== USER_ID) { m.sets = []; m.setsTrimmed = true; n++; } };
    if (t.finals) { t.rr.flat().forEach(trim); t.sf.forEach(trim); trim(t.f); }
    else { t.rounds.forEach(r => r.matches.forEach(trim)); t.qual.rounds.forEach(qr => qr.matches.forEach(trim)); }
    return n;
  };
  let guard = 0;
  while (size() > LIM && guard++ < 40) {
    const cand = (state.archive || []).find(t => trimTournament(t) > 0);
    if (!cand) { // 全部已裁剪仍超限：丢弃最旧归档赛事（history 记录仍保留本场比分）
      if (!(state.archive || []).length) break;
      state.archive.shift();
    }
    save();
  }
}

function playerChipBadge(e, t) {
  const short = s2 => s2.replace('正赛第 ', 'R').replace(/（.*?）/g, '');
  if (t) {
    if (t.userStatus === 'champion') return { cls: 'pb-champ', txt: '冠军' };
    if (t.userStatus === 'alive') {
      let r = '';
      if (t.finals) r = roundLabelOf(t, t.day);
      else if (t.userEntry === 'qual' && state.season.day - t.startDay <= 2) r = '资格赛 R' + (state.season.day - t.startDay + 1);
      else {
        const ri = state.season.day - t.startDay - 3;
        r = (ri >= 0 && t.rounds[ri]) ? short(mainRoundLabel(t.level, t.rounds[ri].name)) : '正赛';
      }
      return { cls: 'pb-live', txt: '进行中', detail: r };
    }
    if (t.userStatus === 'eliminated') {
      if (t.finals) {
        const played = [...t.rr.flat(), ...t.sf, t.f].filter(m => m && m.played && (m.a === USER_ID || m.b === USER_ID));
        const last = played[played.length - 1];
        if (last && t.f === last) return { cls: 'pb-out', txt: '亚军', detail: '总决赛' };
        return { cls: 'pb-out', txt: '止步', detail: last && t.sf.includes(last) ? '半决赛' : '小组赛' };
      }
      let r = '';
      for (let qd = 0; qd < 3 && !r; qd++) for (const m of t.qual.rounds[qd].matches)
        if (m.played && (m.a === USER_ID || m.b === USER_ID) && m.winner !== USER_ID) { r = '资格赛 R' + (qd + 1); break; }
      if (!r) for (const rd of t.rounds) { let f = false;
        for (const m of rd.matches) if (m.played && (m.a === USER_ID || m.b === USER_ID) && m.winner !== USER_ID) { f = true; break; }
        if (f) { r = mainRoundLabel(t.level, rd.name).replace(/（.*?）/g, ''); break; } }
      return { cls: 'pb-out', txt: '止步', detail: r };
    }
  } else if (state.userEntry && state.userEntry.eventId === e.id) {
    return { cls: 'pb-ent', txt: '已报名', detail: (e.startDay - state.season.day) + '天后开赛' };
  }
  return null;
}

// 最佳成绩口径（9.4）：冠军仅在真正赢得正赛决赛时计入；资格赛/早期轮的胜利≠冠军。
// 单场比赛映射"至少到达档"：胜 → 下一轮（赢决赛=冠军）；负 → 出局轮；资格赛胜 = 正赛首轮。
const BEST_ORDER = { Q1:0, Q2:1, Q3:2, R128:3, R64:4, R32:5, R16:6, QF:7, RR:7.5, SF:8, F:9, W:10 };
function computeBestByLevel(hist) {
  const byT = {};
  for (const x of hist) {
    const g = byT[x.tournamentId] || (byT[x.tournamentId] = { level: x.level,
      name: x.tournamentName || ((findTournament(x.tournamentId) || {}).name) || x.tournamentId });
    const arr = ROUND_NAMES[LEVEL_META[x.level].drawSize];
    let reach = null;
    if (x.round[0] === 'Q') reach = x.result === 'W' ? arr[0] : x.round;
    else if (x.round === 'FINALSF') reach = x.result === 'W' ? 'F' : 'SF';
    else if (x.round === 'FINALF') reach = x.result === 'W' ? 'W' : 'F';
    else if (x.round.startsWith('RR')) reach = 'RR';
    else reach = x.result === 'W' ? (x.round === 'F' ? 'W' : arr[arr.indexOf(x.round) + 1]) : x.round;
    if (g.reach == null || BEST_ORDER[reach] > BEST_ORDER[g.reach]) g.reach = reach;
  }
  const best = {};
  for (const tid in byT) {
    const g = byT[tid];
    if (!(g.level in best) || BEST_ORDER[g.reach] > BEST_ORDER[best[g.level].reach]) best[g.level] = g;
  }
  return best;
}
function bestReachText(level, reach) {
  if (reach === 'W') return '<b class="up">冠军</b>';
  if (reach === 'F') return '亚军';
  if (reach === 'RR') return '小组赛';
  if (reach[0] === 'Q') return ROUND_LABEL['Q' + reach.slice(1)];
  return mainRoundLabel(level, reach);
}
// 历史比赛轮次标签（资格赛/总决赛/正赛按签表标注）
function histRoundLabel(x) {
  if (x.round[0] === 'Q') return ROUND_LABEL['Q' + x.round.slice(1)];
  if (x.round.startsWith('RR')) return ROUND_LABEL[x.round];
  if (x.round === 'FINALSF') return '半决赛';
  if (x.round === 'FINALF') return '决赛';
  return mainRoundLabel(x.level, x.round);
}

// 积分走势图：纯 canvas 折线，无外部依赖
function drawPointsChart() {
  const cv = document.getElementById('pts-chart');
  if (!cv) return;
  const data = state.user.pointsLog;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || cv.parentElement.clientWidth - 2, H = 180;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const padL = 40, padR = 12, padT = 14, padB = 24;
  const maxV = Math.max(10, ...data.map(d => d.pts));
  const x = i => padL + (data.length === 1 ? 0 : i * (W - padL - padR) / (data.length - 1));
  const y = v => padT + (1 - v / maxV) * (H - padT - padB);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#E2E8E4'; ctx.fillStyle = '#9AA5A0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  for (let g = 0; g <= 4; g++) {
    const v = maxV * g / 4, yy = y(v);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();
    ctx.fillText(String(Math.round(v)), padL - 5, yy + 3);
  }
  ctx.strokeStyle = '#1B7A3D'; ctx.lineWidth = 2; ctx.beginPath();
  data.forEach((d, i) => { i ? ctx.lineTo(x(i), y(d.pts)) : ctx.moveTo(x(i), y(d.pts)); });
  ctx.stroke();
  ctx.fillStyle = '#1B7A3D';
  data.forEach((d, i) => { ctx.beginPath(); ctx.arc(x(i), y(d.pts), 2.5, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#37474F'; ctx.textAlign = 'left';
  ctx.fillText('第' + data[0].day + '赛日', padL, H - 8);
  ctx.textAlign = 'right';
  ctx.fillText('第' + data[data.length - 1].day + '赛日 · ' + data[data.length - 1].pts + '分', W - padR, H - 8);
}

function handleAction(name, arg, arg2, arg3) {
  switch (name) {
    case 'tab': state.ui.tab = arg; save(); break;
    case 'create': {
      const v = parseInt(document.getElementById('maxreps-input').value, 10);
      if (!Number.isInteger(v) || v < 1 || v > 100) { UI.onboardErr = '请输入 1~100 的整数'; break; }
      UI.onboardErr = '';
      createProfile(v);
      toast(state.preseasonMs
        ? `世界已生成：AI 完成第 0 赛季模拟（${state.preseasonMs}ms），你从第 1001 名、0 积分出发`
        : '档案已创建：1000 名 AI 就位，你从第 1001 名、0 积分出发');
      break;
    }
    case 'startSet': UI.step = 'idle'; break; // 对手 3 局成绩已在比赛创建时生成（4.1 盲打）
    case 'submitReps': {
      const v = parseInt(document.getElementById('reps-input').value, 10);
      if (!Number.isInteger(v) || v < 1 || v > 200) { toast('请输入 1~200 的整数（11.9 上限 200）'); break; }
      if (v > 100) { // 11.9：极端录入二次确认
        UI.pendingReps = v;
        openModal(`<h3>确认录入</h3><p>你录入了 <b>${v}</b> 个俯卧撑，超过 100，请确认没有多打一位数（单局上限 200）。</p>
          <div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="PT.a('closeModal')">返回修改</button>
          <button class="btn btn-sm" onclick="PT.a('confirmHigh')">确认无误，提交</button></div>`);
        break;
      }
      doSubmit(v);
      break;
    }
    case 'confirmHigh': closeModal(); doSubmit(UI.pendingReps); UI.pendingReps = null; break;
    case 'restDay': settleDay(null); UI.lastSettlement = { rest: true }; UI.step = 'settled'; break;
    case 'enterMain': state.qualReport = null; save(); break; // 战报 → 进入正赛第 1 轮（today 已就绪）
    case 'enterEvent': { // 报名选择卡点选：锁定席位（当日兑现 / 远期等待）
      const r = commitEntry(arg);
      if (r === 'busy') toast('你已持有一个赛事席位（单席位制）：请先完成或取消');
      else if (r === 'alive') toast('你正在赛事中：出局后才能报名新赛事');
      else if (r === 'cutoff') toast('你的排名不满足该赛事入围门槛');
      break;
    }
    case 'cancelEntry': state.userEntry = null; save(); toast('已取消报名（无惩罚）'); break;
    case 'skipToEvent': { // 远期预约快进：批量模拟中间 N 天，随后兑现（简报 → 资格赛 R1 / 直通战报）
      if (!state.userEntry || state.userEntry.startDay <= state.season.day) break;
      fastForwardTo(state.userEntry.startDay);
      realizeCommit();
      save();
      break;
    }
    case 'closeSkip': state.skipReport = null; save(); break;
    case 'doneSettlement': UI.step = 'idle'; UI.lastSettlement = null; break;
    case 'retest': {
      const raw = document.getElementById('retest-input').value.trim();
      if (raw !== '') {
        const v = parseInt(raw, 10);
        if (!Number.isInteger(v) || v < 1 || v > 100) { toast('请输入 1~100 的整数，或留空保持不变'); break; }
        state.user.maxReps = v;
        state.user.maxRepsLog.push({ date: todayStr(), value: v });
