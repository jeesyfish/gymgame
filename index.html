    case 'rankQuery': state.ui.rankQuery = arg; state.ui.rankPage = 0; UI.refocus = true; break;
    case 'pageRank': state.ui.rankPage = arg; break;
    case 'jumpMe': state.ui.rankQuery = ''; state.ui.rankPage = Math.floor((state.user.ranking - 1) / RANK_PAGE); break;
    case 'selT': state.ui.calView = arg; save(); break; // 进入独立对阵界面（9.2）
    case 'calBack': // 返回（赛历或我的数据，视进入来源）
      state.ui.calView = null; state.ui.calHighlight = null;
      state.ui.tab = state.ui.calBackTab || 'calendar'; state.ui.calBackTab = null;
      save(); break;
    case 'histToggle': UI.histAll = !UI.histAll; break;
    case 'histOpen': { // 9.4：从历史比赛跳转该场签表（跨赛季归档可查），并滚动定位高亮
      const x = state.history[+arg];
      if (!x) break;
      const t = findTournament(x.tournamentId);
      if (!t) { // 降级：签表彻底不可用时弹出比分详情卡
        openModal(`<h3>${esc(x.tournamentName || '历史赛事')} · 比分详情</h3>
          <p class="muted small mb">该赛事签表已不在存档中（极端裁剪），仅保留本场记录。</p>
          <table><tr><th>局</th><th>你</th><th>对手</th></tr>
          ${x.sets.map((s2, i) => `<tr><td>第 ${i + 1} 局</td><td>${s2[0]}</td><td>${s2[1]}</td></tr>`).join('')}</table>
          <div class="btn-row"><button class="btn btn-sm" onclick="PT.a('closeModal')">关闭</button></div>`);
        break;
      }
      let ref = null;
      if (t.finals) {
        if (x.round[0] === 'R') { const d = +x.round.slice(2) - 1; ref = 'rr:' + d + ':' + Math.max(0, t.rr[d].findIndex(m => m.a === USER_ID || m.b === USER_ID)); }
        else if (x.round === 'FINALSF') ref = 'sf:0:' + Math.max(0, t.sf.findIndex(m => m && (m.a === USER_ID || m.b === USER_ID)));
        else ref = 'f:0:0';
      } else if (x.round[0] === 'Q') {
        const qd = +x.round.slice(1) - 1;
        ref = 'q:' + qd + ':' + Math.max(0, t.qual.rounds[qd].matches.findIndex(m => m.a === USER_ID || m.b === USER_ID));
      } else {
        const ri = Math.max(0, t.rounds.findIndex(r => r.name === x.round));
        ref = 'm:' + ri + ':' + Math.max(0, t.rounds[ri].matches.findIndex(m => m.a === USER_ID || m.b === USER_ID));
      }
      state.ui.tab = 'calendar'; state.ui.calView = t.id; state.ui.calHighlight = ref; state.ui.calBackTab = 'profile';
      save();
      break;
    }
    case 'showMatch': showMatchModal(arg); break;
    case 'closeModal': closeModal(); break;
    case 'export': exportSave(); break;
    case 'importClick': document.getElementById('import-file').click(); break;
    case 'resetFlow':
      openModal(`<h3>重新开始</h3><p class="warn-box">将清空浏览器中的全部存档（选手池、积分、排名、历史），且<b>不可恢复</b>。建议先导出 JSON 备份。</p>
        <div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="PT.a('closeModal')">取消</button>
        <button class="btn btn-danger btn-sm" onclick="PT.a('resetFinal')">我已备份/确认清空</button></div>`);
      break;
    case 'resetFinal':
      openModal(`<h3>最后确认</h3><p>真的要走吗？积分、排名、1000 名老对手都会消失。</p>
        <div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="PT.a('closeModal')">再想想</button>
        <button class="btn btn-danger btn-sm" onclick="PT.a('resetDo')">确认，清空并刷新</button></div>`);
      break;
    case 'resetDo': resetAll(); location.reload(); break;
    case 'correctionFlow':
      openModal(`<h3>纠错通道 · 重新输入力竭次数</h3>
        <p class="warn-box">触发后果：<b>积分清零、排名重置为第 1001 名</b>。进行中赛事不受影响，打完当日赛程后生效（6.5）。仅用于开局手滑。</p>
        <input id="corr-input" class="input mt" type="number" inputmode="numeric" min="1" max="100" placeholder="正确的力竭次数（1~100）">
        <div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="PT.a('closeModal')">取消</button>
        <button class="btn btn-danger btn-sm" onclick="PT.a('correctionDo')">确认清零并重置</button></div>`);
      break;
    case 'correctionDo': {
      const v = parseInt(document.getElementById('corr-input').value, 10);
      if (!Number.isInteger(v) || v < 1 || v > 100) { toast('请输入 1~100 的整数'); break; }
      state.user.maxReps = v;
      state.user.maxRepsLog.push({ date: todayStr(), value: v });
      state.user.points = [];
      state.pendingRankReset = true;
      save(); closeModal();
      toast('积分已清零，打完当前赛程后排名重置为 1001');
      break;
    }
    case 'resetCfgFlow': // 恢复默认配置（9.5）：二次确认，后果说明
      openModal(`<h3>恢复默认配置</h3>
        <p class="warn-box">将<b>全部配置项</b>（含 preseason 偏好与正赛/资格赛入围门槛）恢复为初始默认值，
        并写入队列：<b>本赛季不受影响</b>，新赛季首日或「重新开始」时生效。此操作只改配置，不动积分与排名。</p>
        <div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="PT.a('closeModal')">取消</button>
        <button class="btn btn-danger btn-sm" onclick="PT.a('resetCfgDo')">确认恢复默认</button></div>`);
      break;
    case 'resetCfgDo': { // 与手动修改同通道（11.7 入队机制）：queued = 默认值，current 当季不变
      const dft = defaultConfig();
      dft.preseason = true; // 偏好默认值固定为 true（defaultConfig 会读偏好键，此处显式覆盖）
      state.config.queued = deepCopy(dft);
      savePrefs(Object.assign(loadPrefs(), { preseason: true }));
      save(); closeModal();
      toast('已恢复默认配置：将于下赛季首日或重新开始时生效');
      break;
    }
    case 'cfgNum': case 'cfgArr': case 'cfgFp': {
      const raw = (name === 'cfgArr') ? arg3 : arg2;
      const v = parseFloat(raw);
      if (!isFinite(v)) { toast('请输入数字'); break; }
      if (name === 'cfgNum') state.config.queued[arg] = v;
      else if (name === 'cfgArr') state.config.queued[arg][+arg2] = v;
      else state.config.queued.finalsPoints[arg] = v;
      save(); toast('已保存，将于下赛季生效（11.7）');
      break;
    }
    case 'cfgCut': { // 入围门槛（JSON 双卡）：{ 级别: { main, qual, excludeTop? } }，qual 留空 = 不限
      const raw = arg2 !== undefined ? arg2 : arg; // 兼容旧按级别输入（key,value）与 JSON 文本两种传参
      let o; try { o = JSON.parse(raw); } catch (e) { toast('JSON 解析失败：' + e.message); break; }
      const ok = o && Object.keys(o).every(l => l in LEVEL_META && o[l] && typeof o[l].main === 'number'
        && (o[l].qual == null || typeof o[l].qual === 'number') && (o[l].qual == null || o[l].qual >= o[l].main)
        && (o[l].excludeTop == null || (typeof o[l].excludeTop === 'number' && o[l].excludeTop < o[l].main)));
      if (!ok) { toast('门槛结构不符：{ 级别: { main, qual: null|number, excludeTop?: null|number(<main) } }'); break; }
      state.config.queued.entryCutoff = o;
      save(); toast('已保存，将于下赛季生效（11.7）');
      break;
    }
    case 'cfgBool': { // 建档期行为配置（preseason）：立即写入并持久化偏好，重新开始建档时生效
      const v = arg2 === '1' || arg2 === true;
      state.config.current[arg] = v;
      state.config.queued[arg] = v;
      savePrefs(Object.assign(loadPrefs(), { [arg]: v }));
      save(); toast('已保存：重新开始建档时生效');
      break;
    }
    case 'cfgJson': {
      const ta = document.getElementById(arg === 'points' ? 'cfg-points' : arg === 'qual' ? 'cfg-qual' : 'cfg-cal');
      let o; try { o = JSON.parse(ta.value); } catch (e) { toast('JSON 解析失败：' + e.message); break; }
      if (arg === 'points') {
        const levels = ['GS', 'MASTERS', 'ATP500', 'ATP250', 'CHALLENGER', 'ITF'];
        const rows = ['winner', 'final', 'sf', 'qf', 'r16', 'r32'];
        const ok = levels.every(l => o[l] && rows.every(r => typeof o[l][r] === 'number'));
        if (!ok) { toast('积分表结构不符（需要 6 个级别含 ITF × winner/final/sf/qf/r16/r32 数值）'); break; }
        state.config.queued.pointsTable = o;
      } else if (arg === 'qual') {
        const ok = o && Object.keys(o).every(l => l in LEVEL_META && typeof o[l] === 'number' && l !== 'FINALS');
        if (!ok) { toast('资格赛积分结构不符（级别 → 每轮胜场数值，不含 FINALS）'); break; }
        state.config.queued.qualPoints = o;
      } else {
        const ok = Array.isArray(o) && o.length === TOTAL_WEEKS && o.every(w => Array.isArray(w)
          && w.every(l => typeof l === 'string' && (l in LEVEL_META)));
        if (!ok) { toast('赛历模板须为 ' + TOTAL_WEEKS + ' 个周数组，级别取值：GS/MASTERS/ATP500/ATP250/CHALLENGER/FINALS'); break; }
        state.config.queued.calendarTemplate = o;
      }
      save(); toast('已保存，将于下赛季生效（11.7）');
      break;
    }
  }
  render();
  if (UI.refocus) { // 排名搜索框失焦恢复
    UI.refocus = false;
    const inp = document.querySelector('#main input.input');
    if (inp && state.ui.tab === 'rankings') { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}
// 提交一局成绩（4.1：严格大于才赢，相等算输）
function doSubmit(n) {
  const t = state.today;
  const ai = t.aiSets[t.nextSet - 1]; // 对手成绩早已生成持久化；确认瞬间才揭晓（4.1 盲打）
  t.sets.push({ user: n, ai: ai });
  if (n > ai) t.uw++; else t.ow++;
  UI.lastSet = { user: n, ai: ai, won: n > ai };
  t.nextSet++;
  if (t.uw !== 2 && t.ow !== 2) { UI.step = 'result'; save(); return; }
  // 比赛结束（2:0 或 2:1，2:0 不打第三局 —— 由局循环自然终止）
  const tour = tournamentOf(t.tournamentId);
  const res = { tournamentId: t.tournamentId, finals: t.finals, day: t.day, roundIdx: t.roundIdx,
    qualRound: t.qualRound != null ? t.qualRound : undefined, oppId: t.oppId, won: t.uw === 2, sets: t.sets };
  const prevRank = state.user.ranking;
  state.today = null; UI.step = 'idle';
  settleDay(res); // 11.1 完整结算
  const h = state.history[state.history.length - 1];
  UI.lastSettlement = { rest: false, won: res.won, pts: h ? h.pointsEarned : 0,
    prevRank, rank: state.user.ranking, tid: res.tournamentId,
    roundTxt: settlementRound(tour, res), statusTxt: settlementStatus(tour, res) };
  UI.step = 'settled';
}
function settlementRound(t, res) {
  if (res.qualRound != null) return ROUND_LABEL['Q' + (res.qualRound + 1)];
  if (t.finals) return res.day <= 3 ? `小组赛第 ${res.day} 轮` : res.day === 4 ? '半决赛' : '决赛';
  return mainRoundLabel(t.level, t.rounds[res.roundIdx].name);
}
function settlementStatus(t, res) {
  if (res.qualRound != null) {
    if (res.won) return res.qualRound < 2 ? `资格赛晋级（+${(cfg().qualPoints && cfg().qualPoints[t.level]) || 0} 分）` : '从资格赛突围，晋级正赛！';
    return '资格赛出局，本站结束';
  }
  if (res.won) {
    if (t.finals) return res.day <= 3 ? '小组赛取胜' : res.day === 4 ? '晋级总决赛决赛！' : '夺得总决赛冠军！';
    if (t.rounds[res.roundIdx].name === 'F') return '夺得本站冠军！';
    return '晋级 ' + ROUND_LABEL[t.rounds[res.roundIdx + 1].name];
  }
  if (t.finals) return res.day <= 3 ? '小组赛失利（单循环仍保留出线机会）' : res.day === 4 ? '止步总决赛四强' : '总决赛亚军';
  return '止步 ' + ROUND_LABEL[t.rounds[res.roundIdx].name];
}
/* ########################################################################
 * 启动入口
 * ######################################################################## */
function onImportFile(ev) {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const err = importSave(rd.result);
    if (err) { toast(err); if (UI.corrupt) render(); }
    else { UI.corrupt = false; toast('导入成功，存档已恢复'); render(); }
  };
  rd.readAsText(f);
}
function init() {
  const r = load();
  if (r === 'corrupt') UI.corrupt = true;
  document.getElementById('import-file').addEventListener('change', onImportFile);
  window.PT = { a: handleAction };
  // 测试/调试钩子（不影响游戏逻辑）
  window.__PT = { state: () => state, save, load, createProfile, settleDay, newSeason, advanceToDay,
    expirePoints, recomputeRankings, genSetScore, genMatchM, simulateMatchAI, totalPoints,
    tournamentOf, playerById, LEVEL_META, defaultConfig, absDayOf, seasonLength, groupStandings,
    busySet, simulatePreseason, generateDayEvents, simulateDayRounds,
    playerEntryFor, nextEnterableEvent, fastForwardQualDays, fastForwardTo, commitEntry, realizeCommit,
    _setFFDisable: v => { FF_DISABLED = !!v; } };
  render();
}
init();
</script>
